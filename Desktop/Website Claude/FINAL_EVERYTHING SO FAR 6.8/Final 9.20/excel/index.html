  <style>
    :root {
      --navy: #0d1e4a; --navy-dark: #091535;
      --gold: #c9a05a; --gold-ink: #8a6420;
      --page: #f3f1ec; --card: #ffffff; --line: #e3dfd6; --line-strong: #cfc8b9;
      --ink: #1c232b; --muted: #6b7480; --neg: #b3261e;
      --past: #f7f6f2; --now: #fdf6e7;
      --row-pay: #eef3fb; --row-save: #fff3bf; --row-shared: #fbe9c6; --row-rem: #f6dce7; --row-total: #f4f1ea;
      --stick-w: 260px; --due-w: 64px; --budget-w: 92px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', sans-serif; background: var(--page); color: var(--ink); min-height: 100vh; font-size: 14px; }
    button, input, select { font: inherit; color: inherit; }

    /* ── top bar ── */
    .topbar { background: var(--navy-dark); color: #f8f5ef; display: flex; align-items: center; gap: 1rem; padding: 0.8rem 1.25rem; position: sticky; top: 0; z-index: 30; }
    .topbar img { height: 38px; display: block; }
    .topbar h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.6rem; letter-spacing: 0.01em; margin-right: auto; }
    .save-state { font-size: 0.72rem; letter-spacing: 0.06em; color: #c8c0b0; display: flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
    .save-state::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #6fbf73; }
    .save-state[data-s="saving"]::before { background: var(--gold); }
    .save-state[data-s="local"]::before, .save-state[data-s="error"]::before { background: #e57373; }
    .menu-btn { background: transparent; border: 1px solid rgba(201,160,90,0.4); color: #f8f5ef; border-radius: 6px; padding: 0.4rem 0.7rem; cursor: pointer; font-size: 0.78rem; }
    .menu-btn:hover { border-color: var(--gold); color: var(--gold); }
    .menu { position: relative; }
    .menu-list { display: none; position: absolute; right: 0; top: calc(100% + 6px); background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.18); min-width: 220px; padding: 0.35rem; }
    .menu.open .menu-list { display: block; }
    .menu-list button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0.55rem 0.7rem; border-radius: 5px; cursor: pointer; font-size: 0.85rem; }
    .menu-list button:hover { background: var(--page); }
    .menu-list a { display: block; padding: 0.55rem 0.7rem; color: var(--ink); text-decoration: none; font-size: 0.85rem; border-radius: 5px; }
    .menu-list a:hover { background: var(--page); }

    main { padding: 1.25rem; max-width: 1600px; margin: 0 auto; }

    .banner { display: none; background: #fff4e5; border: 1px solid #f0c98a; color: #6b4a12; padding: 0.7rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; }
    .banner.show { display: block; }

    /* ── controls ── */
    .controls { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .range-label { font-weight: 600; font-size: 1.05rem; min-width: 12rem; text-align: center; }
    .btn { background: var(--card); border: 1px solid var(--line-strong); border-radius: 6px; padding: 0.45rem 0.8rem; cursor: pointer; font-size: 0.82rem; }
    .btn:hover { border-color: var(--gold); }
    .btn.icon { width: 2.2rem; padding: 0.45rem 0; text-align: center; }
    .btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
    .btn.primary:hover { background: var(--navy-dark); }
    .btn.danger { color: var(--neg); }
    .controls select { background: var(--card); border: 1px solid var(--line-strong); border-radius: 6px; padding: 0.42rem 0.5rem; font-size: 0.82rem; }
    .spacer { flex: 1; }

    /* ── stats ── */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem 0.9rem; }
    .stat .k { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    .stat .v { font-size: 1.25rem; font-weight: 700; margin-top: 0.25rem; font-variant-numeric: tabular-nums; }
    .stat .v.neg { color: var(--neg); }

    /* ── difference row under the paycheck section total ── */
    tr.diff-row td, tr.diff-row td.col-name, tr.diff-row td.col-due, tr.diff-row td.col-budget { background: #fbfaf7; }
    tr.diff-row td.col-name .lbl { padding-left: 0.8rem; font-weight: 600; font-size: 0.82rem; display: block; }
    tr.diff-row td.col-name .lbl small { display: block; font-weight: 400; font-size: 0.66rem; color: var(--muted); }
    tr.diff-row .g { color: #2e7d32; font-weight: 600; } tr.diff-row .r { color: var(--neg); font-weight: 600; }
    .sheet tr.diff-row td.cell.over, .sheet tr.diff-row td.cell.over.past, .sheet tr.diff-row td.cell.over.now { background: #dcf1dc; }
    .sheet tr.diff-row td.cell.short, .sheet tr.diff-row td.cell.short.past, .sheet tr.diff-row td.cell.short.now { background: #f8d7d5; }
    tr.diff-row td.cell.over .calc { color: #2e7d32; font-weight: 700; }
    tr.diff-row td.cell.short .calc { color: var(--neg); font-weight: 700; }

    /* ── balance colors on paycheck cells ── */
    .sheet td.cell.bal-pos, tr.section-head td.cell.bal-pos, tr.sum-pay td.cell.bal-pos { background: #dcf1dc !important; }
    .sheet td.cell.bal-neg, tr.section-head td.cell.bal-neg, tr.sum-pay td.cell.bal-neg { background: #f8d7d5 !important; }
    tr.section-head td.cell.bal-pos input, tr.section-head td.cell.bal-neg input { color: var(--ink); }
    tr.section-head td.cell.bal-pos input::placeholder, tr.section-head td.cell.bal-neg input::placeholder { color: var(--ink); }
    .sheet td.cell.bal-neg input, .sheet td.cell.bal-neg input::placeholder { color: var(--neg); }
    .sheet thead tr.dates th.hd-pos { box-shadow: inset 0 -3px 0 #7cc47f; }
    .sheet thead tr.dates th.hd-neg { box-shadow: inset 0 -3px 0 #e06b63; color: var(--neg); }

    /* ── suggested amount "?" ── */
    .sugg { position: absolute; top: 2px; right: 2px; width: 13px; height: 13px; border-radius: 50%; border: 0; background: #ece7db; color: var(--gold-ink); font-size: 0.55rem; font-weight: 700; line-height: 13px; padding: 0; cursor: pointer; z-index: 3; opacity: 0.55; }
    .sheet td.cell:hover .sugg { opacity: 1; }
    .sugg:hover { background: var(--gold); color: #fff; }
    .sugg-pop { position: absolute; top: 16px; right: 2px; z-index: 20; background: var(--navy-dark); color: #fff; border-radius: 6px; padding: 0.45rem 0.6rem; font-size: 0.72rem; line-height: 1.4; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,0.25); text-align: left; pointer-events: none; }
    .sugg-pop b { color: var(--gold-light, #dbb97a); font-size: 0.85rem; }
    .sugg-pop small { display: block; color: #c8c0b0; font-size: 0.66rem; }

    /* ── bill not fully planned before its due date ── */
    .sheet td.cell.due-short { background: #ffe1bd !important; box-shadow: inset 0 0 0 1px #f0a24a; }
    .sheet td.cell.due-short .sugg { opacity: 1; background: #f0a24a; color: #fff; }

    /* ── bill due before the month's first paycheck ── */
    .sheet td.cell.due-late { box-shadow: inset 0 0 0 2px #d93025 !important; }
    .sheet td.cell.due-late::after { content: '!'; position: absolute; left: 3px; bottom: 1px; font-size: 0.6rem; font-weight: 800; color: #d93025; }

    /* ── drag to move amounts ── */
    .sheet td.cell { position: relative; }
    .grip { position: absolute; left: 3px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; line-height: 1; color: #a8a090; cursor: grab; opacity: 0; padding: 4px 2px; border-radius: 3px; z-index: 2; user-select: none; }
    .sheet td.cell:hover .grip { opacity: 1; }
    .grip:hover { background: var(--page); color: var(--gold-ink); }
    tr.drag-row td.cell { outline: 1px dashed rgba(201,160,90,0.45); outline-offset: -3px; }
    td.cell.drop-target { background: #fdf0d2 !important; outline: 2px solid var(--gold) !important; outline-offset: -2px; }
    td.cell.drag-src { opacity: 0.45; }
    @media (hover: none) { .grip { display: none; } }

    /* ── 6-month overview ── */
    .overview { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem 0.9rem 0.5rem; margin-bottom: 1rem; }
    .ov-title { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.4rem; }
    .ov-scroll { overflow-x: auto; }
    table.ov { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 640px; }
    table.ov th, table.ov td { padding: 0.4rem 0.6rem; text-align: right; font-size: 0.85rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
    table.ov tbody th { text-align: left; font-weight: 500; color: var(--muted); font-size: 0.78rem; }
    table.ov tr:last-child th, table.ov tr:last-child td { border-bottom: 0; }
    table.ov td { font-weight: 600; }
    table.ov td.neg { color: var(--neg); }
    table.ov .tot { background: #faf8f3; border-left: 2px solid var(--line-strong); }
    table.ov thead th.tot { font-size: 0.72rem; color: var(--gold-ink); text-transform: uppercase; letter-spacing: 0.06em; }
    table.ov tr.ov-save td { background: rgba(255, 243, 191, 0.55); }
    table.ov tr.ov-rem td { background: rgba(246, 220, 231, 0.55); }
    table.ov tr.ov-save td.tot, table.ov tr.ov-rem td.tot { font-weight: 700; }
    .ov-month { background: none; border: 0; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: var(--ink); text-align: right; }
    .ov-month small { display: block; font-weight: 400; font-size: 0.66rem; color: var(--muted); }
    .ov-month:hover { color: var(--gold-ink); text-decoration: underline; text-decoration-color: var(--gold); }

    /* ── grid ── */
    .sheet-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: calc(100vh - 230px); }
    table.sheet { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
    .sheet th, .sheet td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; height: 34px; white-space: nowrap; }
    .sheet thead th { position: sticky; background: #fbfaf7; z-index: 5; font-weight: 600; font-size: 0.75rem; }
    .sheet thead tr.months th { top: 0; height: 30px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold-ink); border-bottom-color: var(--line); }
    .sheet thead tr.dates th { top: 30px; color: var(--muted); font-weight: 500; }
    .sheet thead th.month { border-right: 2px solid var(--line-strong); }
    .sheet th.col-name, .sheet td.col-name { position: sticky; left: 0; z-index: 4; background: var(--card); width: var(--stick-w); min-width: var(--stick-w); max-width: var(--stick-w); text-align: left; }
    .sheet th.col-due, .sheet td.col-due { position: sticky; left: var(--stick-w); z-index: 4; background: var(--card); width: var(--due-w); min-width: var(--due-w); max-width: var(--due-w); text-align: center; }
    .due-val { font-size: 0.78rem; font-weight: 600; color: var(--gold-ink); overflow: hidden; text-overflow: ellipsis; padding: 0 0.2rem; }
    .due-val.soon { background: var(--gold); color: #fff; border-radius: 999px; padding: 0.15rem 0.45rem; display: inline-block; }
    .sheet th.col-budget, .sheet td.col-budget { position: sticky; left: calc(var(--stick-w) + var(--due-w)); z-index: 4; background: var(--card); width: var(--budget-w); min-width: var(--budget-w); text-align: right; border-right: 2px solid var(--line-strong); }
    .sheet thead th.col-name, .sheet thead th.col-due, .sheet thead th.col-budget { z-index: 7; background: #fbfaf7; }
    .sheet thead th.col-name { padding-left: 0.8rem; }
    .sheet thead th.col-budget { padding-right: 0.6rem; }
    .sheet td.cell { width: 96px; min-width: 96px; }
    .sheet td.cell.month-end, .sheet th.month-end { border-right: 2px solid var(--line-strong); }
    .sheet td.cell.past { background: var(--past); }
    .sheet td.cell.now, .sheet thead th.now { background: var(--now); }
    .sheet thead th.now { color: var(--gold-ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--gold); }

    .name-btn { display: flex; align-items: center; gap: 0.4rem; width: 100%; height: 100%; padding: 0 0.6rem 0 0.8rem; background: none; border: 0; cursor: pointer; text-align: left; overflow: hidden; }
    .name-btn:hover .nm { text-decoration: underline; text-decoration-color: var(--gold); }
    .name-btn .txt { display: flex; flex-direction: column; overflow: hidden; min-width: 0; flex: 1; }
    .name-btn .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; font-size: 0.85rem; }
    .name-btn .nt { font-size: 0.68rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
    .chip { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.04em; padding: 0.1rem 0.35rem; border-radius: 999px; background: #eef0f2; color: var(--muted); flex: none; }
    .chip.rep { background: #e7f0e4; color: #3d6b35; }
    .chip.shr { background: var(--row-shared); color: var(--gold-ink); }
    .name-btn.sub { padding-left: 2.1rem; }
    .name-btn.sub::before { content: '↳'; color: var(--line-strong); margin-left: -1.1rem; width: 0.8rem; flex: none; }
    .name-btn.sub .nm { font-weight: 400; color: #3b434c; }
    .budget-val { padding-right: 0.6rem; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }

    .cell input { width: 100%; height: 33px; border: 0; background: transparent; text-align: right; padding: 0 0.55rem; font-size: 0.85rem; font-variant-numeric: tabular-nums; outline: none; }
    .cell input::placeholder { color: var(--ink); font-style: normal; opacity: 1; }
    .cell input:focus { background: #fff; box-shadow: inset 0 0 0 2px var(--gold); }
    .cell input.zero { color: #b5bac1; }
    .cell input.neg { color: var(--neg); }
    .calc { text-align: right; padding: 0 0.55rem; font-weight: 600; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
    .calc.neg { color: var(--neg); }

    tr.section-head td { background: var(--navy); color: #fff; height: 38px; }
    tr.section-head td.col-name, tr.section-head td.col-due, tr.section-head td.col-budget { background: var(--navy); }
    tr.section-head .sec-title { display: flex; align-items: center; gap: 0.6rem; padding-left: 0.8rem; }
    tr.section-head .sec-title button.sec-name { background: none; border: 0; color: #fff; font-weight: 600; letter-spacing: 0.04em; cursor: pointer; font-size: 0.85rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    tr.section-head .sec-title { padding-right: 0.5rem; }
    tr.section-head .add-line { flex: none; }
    tr.add-row td, tr.add-row td.col-name, tr.add-row td.col-due, tr.add-row td.col-budget { background: var(--card); height: 34px; }
    tr.add-row .add-exp { display: flex; align-items: center; gap: 0.45rem; width: 100%; height: 100%; padding: 0 0.8rem; background: none; border: 0; cursor: pointer; color: var(--gold-ink); font-weight: 600; font-size: 0.8rem; text-align: left; }
    tr.add-row .add-exp .plus { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--gold); color: var(--gold-ink); font-size: 0.95rem; line-height: 1; }
    tr.add-row .add-exp:hover { background: var(--now); }
    tr.add-row .add-exp:hover .plus { background: var(--gold); color: #fff; }
    tr.section-head .sec-title button.sec-name:hover { color: var(--gold); }
    tr.section-head .add-line { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 4px; font-size: 0.68rem; padding: 0.15rem 0.45rem; cursor: pointer; }
    tr.section-head .add-line:hover { border-color: var(--gold); color: var(--gold); }
    tr.section-head .tag { font-size: 0.62rem; color: var(--gold); letter-spacing: 0.06em; }

    tr.section-head td.cell, tr.section-head td.cell.past, tr.section-head td.cell.now { background: var(--navy); }
    tr.section-head td.cell.now { background: #1c2f63; }
    tr.section-head .cell input { color: #fff; font-weight: 600; }
    tr.section-head .cell input::placeholder { color: #fff; font-weight: 600; }
    tr.section-head .cell input:focus { background: #fff; color: var(--ink); }
    tr.total-row td, tr.total-row td.col-name, tr.total-row td.col-due, tr.total-row td.col-budget { background: var(--row-total); font-weight: 600; }
    tr.total-row td.col-name { padding-left: 0.8rem; font-size: 0.8rem; }
    tr.total-row td.col-due, tr.total-row td.col-budget { padding-right: 0.6rem; font-size: 0.82rem; }
    tr.sum-pay td, tr.sum-pay td.col-name, tr.sum-pay td.col-due, tr.sum-pay td.col-budget { background: var(--row-pay); }
    tr.sum-save td, tr.sum-save td.col-name, tr.sum-save td.col-due, tr.sum-save td.col-budget { background: var(--row-save); }
    tr.sum-shared td, tr.sum-shared td.col-name, tr.sum-shared td.col-due, tr.sum-shared td.col-budget { background: var(--row-shared); }
    tr.sum-rem td, tr.sum-rem td.col-name, tr.sum-rem td.col-due, tr.sum-rem td.col-budget { background: var(--row-rem); }
    tr.sum-row td.col-name .lbl { padding-left: 0.8rem; font-weight: 600; font-size: 0.85rem; display: block; }
    tr.sum-row td.col-name .lbl small { display: block; font-weight: 400; font-size: 0.66rem; color: var(--muted); }
    tr.sum-pay td.cell.past, tr.sum-pay td.cell.now { background: var(--row-pay); }
    tr.sum-save td.cell.past, tr.sum-save td.cell.now { background: var(--row-save); }
    tr.sum-shared td.cell.past, tr.sum-shared td.cell.now { background: var(--row-shared); }
    tr.sum-rem td.cell.past, tr.sum-rem td.cell.now { background: var(--row-rem); }
    tr.sum-row td.col-name .lbl small { overflow: hidden; text-overflow: ellipsis; }
    tr.spacer-row td { height: 14px; background: var(--page); border-right: 0; }
    tr.spacer-row td.col-name, tr.spacer-row td.col-due, tr.spacer-row td.col-budget { background: var(--page); }

    .add-section { margin-top: 1rem; }
    .hint { color: var(--muted); font-size: 0.78rem; margin-top: 0.8rem; line-height: 1.6; }

    /* ── empty state ── */
    .welcome { max-width: 560px; margin: 4rem auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 2rem; text-align: center; }
    .welcome h2 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; margin-bottom: 0.6rem; }
    .welcome p { color: var(--muted); line-height: 1.6; margin-bottom: 1.4rem; }
    .welcome .row { display: flex; gap: 0.7rem; justify-content: center; flex-wrap: wrap; }

    /* ── dialog ── */
    dialog { margin: auto; max-height: calc(100vh - 32px); overflow: auto; border: 0; border-radius: 12px; padding: 0; width: min(440px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,0.3); color: var(--ink); }
    dialog::backdrop { background: rgba(9,21,53,0.45); }
    dialog form { padding: 1.4rem; display: grid; gap: 0.9rem; }
    dialog h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; }
    dialog label { display: grid; gap: 0.3rem; font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    dialog input[type=text], dialog select { border: 1px solid var(--line-strong); border-radius: 6px; padding: 0.55rem 0.65rem; font-size: 0.9rem; text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 400; }
    dialog input[type=text]:focus, dialog select:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
    dialog .check { display: flex; align-items: center; gap: 0.5rem; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink); font-size: 0.88rem; }
    dialog .help { font-size: 0.72rem; color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 400; line-height: 1.5; }
    dialog .actions { display: flex; gap: 0.5rem; justify-content: flex-end; flex-wrap: wrap; margin-top: 0.3rem; }
    dialog .actions .left { margin-right: auto; display: flex; gap: 0.4rem; }

    .apply-choices { display: grid; gap: 0.5rem; }
    .apply-choices .btn { padding: 0.75rem 0.9rem; text-align: left; font-size: 0.88rem; }
    .apply-choices .btn small { display: block; font-size: 0.72rem; opacity: 0.75; margin-top: 0.15rem; }

    @media (max-width: 700px) {
      :root { --stick-w: 150px; --due-w: 48px; --budget-w: 74px; }
      main { padding: 0.75rem 16px; }
      .topbar { padding: 0.6rem 16px; gap: 0.6rem; }
      .topbar img { height: 30px; }
      .topbar h1 { font-size: 1.3rem; }
      .save-state span { display: none; }
      .range-label { flex-basis: 100%; order: -1; text-align: left; min-width: 0; white-space: nowrap; }
      .controls select { flex: 1; }
      .controls .spacer { display: none; }
      .name-btn .chip { display: none; }
      .sheet-wrap { max-height: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/"><img src="/FullLogo_Transparent.png" alt="Mirmont Construction" /></a>
    <h1>Budget</h1>
    <div class="save-state" id="saveState" data-s="ok"><span id="saveText">Loading…</span></div>
    <div class="menu" id="menu">
      <button class="menu-btn" id="menuBtn" aria-haspopup="true">Menu ▾</button>
      <div class="menu-list" role="menu">
        <button type="button" id="mAddSection">Add a section</button>
        <button type="button" id="mExport">Download backup (.json)</button>
        <button type="button" id="mImport">Import data file…</button>
        <a href="/">← Back to website</a>
      </div>
    </div>
  </header>
  <input type="file" id="fileInput" accept=".json,application/json" hidden />

  <main>
    <div class="banner" id="banner"></div>
    <div id="app"></div>
  </main>

  <!-- Line item editor -->
  <dialog id="itemDlg">
    <form method="dialog" id="itemForm">
      <h3 id="itemDlgTitle">Edit line</h3>
      <label>Name<input type="text" id="fName" required maxlength="80" /></label>
      <label>Note<input type="text" id="fNote" maxlength="120" placeholder="e.g. due on the 28th, $650/yr" /></label>
      <label>Due<input type="text" id="fDue" maxlength="20" placeholder="Day of the month, e.g. 28 — or a date like Jan 15" /></label>
      <label>Monthly budget<input type="text" id="fBudget" inputmode="decimal" placeholder="0" /></label>
      <label id="fSecWrap">Section<select id="fSection"></select></label>
      <label>Repeats
        <select id="fRepeat">
          <option value="off">Doesn't repeat</option>
          <option value="every">Every paycheck</option>
          <option value="monthly">Once a month</option>
          <option value="quarterly">Every 3 months</option>
          <option value="semiannual">Every 6 months</option>
          <option value="yearly">Once a year</option>
        </select>
        <span class="help">A repeating line copies its last amount into later pay periods. Type over any period to change it from there on. Type 0 to stop it.</span>
      </label>
      <label class="check"><input type="checkbox" id="fSub" /> Indent under the line above (part of that expense)</label>
      <label class="check"><input type="checkbox" id="fShared" /> Include in "Send to Shared"</label>
      <div class="actions">
        <div class="left">
          <button type="button" class="btn icon" id="fUp" title="Move up">↑</button>
          <button type="button" class="btn icon" id="fDown" title="Move down">↓</button>
          <button type="button" class="btn danger" id="fDelete">Delete</button>
        </div>
        <button type="button" class="btn" id="fCancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Apply-to prompt -->
  <dialog id="applyDlg">
    <form method="dialog" id="applyForm">
      <h3>Apply this change to…</h3>
      <p id="applyText" style="font-size:0.9rem;line-height:1.5;color:var(--ink)"></p>
      <div class="apply-choices">
        <button type="button" class="btn" id="applyOne"></button>
        <button type="button" class="btn primary" id="applyFuture"></button>
      </div>
      <div class="actions"><button type="button" class="btn" id="applyCancel">Cancel</button></div>
    </form>
  </dialog>

  <!-- Section editor -->
  <dialog id="secDlg">
    <form method="dialog" id="secForm">
      <h3 id="secDlgTitle">Edit section</h3>
      <label>Section name<input type="text" id="sName" required maxlength="60" /></label>
      <label class="check"><input type="checkbox" id="sFromPay" /> Paid from paycheck</label>
      <span class="help" style="margin-top:-0.5rem;font-size:0.72rem;color:var(--muted)">Lines in "paid from paycheck" sections are subtracted from the paycheck to work out Send to Savings.</span>
      <div class="actions">
        <div class="left">
          <button type="button" class="btn icon" id="sUp" title="Move up">↑</button>
          <button type="button" class="btn icon" id="sDown" title="Move down">↓</button>
          <button type="button" class="btn danger" id="sDelete">Delete</button>
        </div>
        <button type="button" class="btn" id="sCancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script>
  (() => {
    'use strict';
    const API = '/excel/api/budget';
    const LS_KEY = 'mirmont-budget-v1';
    const LS_VIEW = 'mirmont-budget-view';
    const DAY = 86400000;
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    let data = null;      // the budget document
    let rev = 0;          // server revision
    let mode = 'server';  // 'server' | 'local'
    let saveTimer = null, saving = false, pendingSave = false;

    const view = { start: null, months: 3 };
    try { const v = JSON.parse(localStorage.getItem(LS_VIEW) || '{}'); if ([3,6,12].includes(v.months)) view.months = v.months; } catch {}

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = (n, blankZero) => {
      if (n == null || isNaN(n)) return '';
      if (blankZero && n === 0) return '';
      const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 });
      return (n < 0 ? '−$' : '$') + s;
    };
    const plain = (n) => n == null ? '' : String(Math.round(n * 100) / 100);
    const parseAmt = (s) => {
      s = String(s ?? '').trim().replace(/[$,\s]/g, '').replace(/^\((.*)\)$/, '-$1').replace('−', '-');
      if (s === '') return null;
      const n = Number(s);
      return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
    };
    const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    // ── dates (all UTC, ISO yyyy-mm-dd) ──
    const toISO = (t) => new Date(t).toISOString().slice(0, 10);
    const fromISO = (s) => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
    const monthStart = (y, m) => Date.UTC(y, m, 1);
    const todayUTC = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); };

    function periodsBetween(t0, t1) { // pay dates in [t0, t1)
      const step = (data.periodDays || 14) * DAY, a = fromISO(data.anchor);
      let k = Math.ceil((t0 - a) / step), out = [];
      for (let t = a + k * step; t < t1; t = a + (++k) * step) out.push(toISO(t));
      return out;
    }
    function periodsInMonth(iso) {
      const y = +iso.slice(0, 4), m = +iso.slice(5, 7) - 1;
      return periodsBetween(monthStart(y, m), monthStart(y, m + 1));
    }
    function currentPeriod() {
      const step = (data.periodDays || 14) * DAY, a = fromISO(data.anchor);
      return toISO(a + Math.floor((todayUTC() - a) / step) * step);
    }

    // ── values & repeat logic ──
    const sortedCache = new Map();
    function explicitDates(id) {
      if (!sortedCache.has(id)) sortedCache.set(id, Object.keys(data.values[id] || {}).sort());
      return sortedCache.get(id);
    }
    function lastBefore(id, iso) { // latest explicit date strictly before iso
      const ds = explicitDates(id);
      let lo = 0, hi = ds.length - 1, ans = null;
      while (lo <= hi) { const mid = (lo + hi) >> 1; if (ds[mid] < iso) { ans = ds[mid]; lo = mid + 1; } else hi = mid - 1; }
      return ans;
    }
    function itemInfo(id) {
      if (data.special[id]) return data.special[id];
      for (const s of data.sections) for (const it of s.items) if (it.id === id) return it;
      return null;
    }
    // returns {v, carried}
    function cellValue(id, iso) {
      const vals = data.values[id] || {};
      if (iso in vals) return { v: vals[iso], carried: false };
      const it = itemInfo(id);
      const rep = it && it.repeat;
      if (!rep || rep === 'off') return { v: null, carried: false };
      if (rep === 'every') {
        const src = lastBefore(id, iso);
        return src ? { v: vals[src], carried: true } : { v: null, carried: false };
      }
      // monthly / quarterly: one carried amount per month (every 3rd month for quarterly),
      // in the same paycheck slot as the source
      const inMonth = periodsInMonth(iso);
      if (inMonth.some(d => d in vals)) return { v: null, carried: false };
      const src = lastBefore(id, inMonth[0]);
      if (!src) return { v: null, carried: false };
      const every = { quarterly: 3, semiannual: 6, yearly: 12 }[rep];
      if (every) {
        const mi = (d) => (+d.slice(0, 4)) * 12 + (+d.slice(5, 7));
        if ((mi(iso) - mi(src)) % every !== 0) return { v: null, carried: false };
      }
      const srcSlot = periodsInMonth(src).indexOf(src);
      const slot = Math.min(srcSlot, inMonth.length - 1);
      return inMonth.indexOf(iso) === slot ? { v: vals[src], carried: true } : { v: null, carried: false };
    }
    const num = (id, iso) => cellValue(id, iso).v || 0;

    function computePeriod(iso) {
      const r = { sections: {} , fromPay: 0, shared: 0 };
      for (const s of data.sections) {
        let t = 0;
        for (const it of s.items) {
          const v = num(it.id, iso); t += v;
          if (it.shared) r.shared += v;
        }
        r.sections[s.id] = t;
        if (s.fromPaycheck) r.fromPay += t;
      }
      r.pay = num('paycheck', iso);
      r.savings = r.pay - r.fromPay;
      r.sharedTotal = r.shared + r.savings;
      r.withdraw = num('withdraw', iso);
      r.remainder = r.savings - r.withdraw;
      return r;
    }

    function setValue(id, iso, n) {
      data.values[id] = data.values[id] || {};
      if (n === null) delete data.values[id][iso]; else data.values[id][iso] = n;
      sortedCache.delete(id);
    }

    // ── rendering ──
    function visibleMonths() {
      const out = [];
      for (let i = 0; i < view.months; i++) {
        const t = monthStart(view.start.y, view.start.m + i), d = new Date(t);
        out.push({ y: d.getUTCFullYear(), m: d.getUTCMonth(), periods: periodsBetween(t, monthStart(view.start.y, view.start.m + i + 1)) });
      }
      return out;
    }

    const ordinal = (n) => n + ((n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'));
    function dueHtml(due) {
      if (due == null || String(due).trim() === '') return '';
      const t = String(due).trim();
      if (/^\d{1,2}$/.test(t)) {
        const d = +t, today = new Date().getDate();
        const ahead = (d - today + 31) % 31; // due within the next 5 days
        return `<span class="due-val${ahead <= 5 ? ' soon' : ''}" title="Due on the ${ordinal(d)} of each month">${ordinal(d)}</span>`;
      }
      return `<span class="due-val" title="${esc(t)}">${esc(t)}</span>`;
    }

    function render() {
      sortedCache.clear();
      const app = $('app');
      if (!data) { renderWelcome(); return; }
      const months = visibleMonths();
      const cols = [];
      months.forEach(mo => mo.periods.forEach((p, i) => cols.push({ iso: p, monthEnd: i === mo.periods.length - 1 })));
      const nowP = currentPeriod();
      const calc = Object.fromEntries(cols.map(c => [c.iso, computePeriod(c.iso)]));
      const cls = (c) => ['cell', c.monthEnd ? 'month-end' : '', c.iso < nowP ? 'past' : '', c.iso === nowP ? 'now' : ''].join(' ');

      const first = months[0], last = months[months.length - 1];
      const rangeLbl = first.y === last.y
        ? `${MONTHS[first.m]} – ${MONTHS[last.m]} ${last.y}`
        : `${MONTHS[first.m]} ${first.y} – ${MONTHS[last.m]} ${last.y}`;

      let h = '';
      // controls
      h += `<div class="controls">
        <button class="btn icon" data-act="prev" title="Earlier month">◀</button>
        <div class="range-label">${rangeLbl}</div>
        <button class="btn icon" data-act="next" title="Later month">▶</button>
        <button class="btn" data-act="today">This month</button>
        <span class="spacer"></span>
        <select data-act="months" aria-label="Months shown">
          ${[3,6,12].map(n => `<option value="${n}" ${n === view.months ? 'selected' : ''}>Show ${n} months</option>`).join('')}
        </select>
      </div>`;

      // stats for current month
      const nowMonth = periodsInMonth(nowP);
      const agg = nowMonth.reduce((a, p) => { const c = computePeriod(p); a.pay += c.pay; a.from += c.fromPay; a.save += c.savings; a.rem += c.remainder; return a; }, { pay: 0, from: 0, save: 0, rem: 0 });
      const nd = new Date(fromISO(nowP));
      const stat = (k, v) => `<div class="stat"><div class="k">${k}</div><div class="v ${v < 0 ? 'neg' : ''}">${money(v) || '$0'}</div></div>`;
      h += `<div class="stats">
        ${stat(`${MONTHS[nd.getUTCMonth()]} paychecks (${nowMonth.length})`, agg.pay)}
        ${stat('Paid from paycheck', agg.from)}
        ${stat('Send to savings', agg.save)}
        ${stat('Remainder', agg.rem)}
      </div>`;

      // next 6 months overview
      const ahead = [];
      for (let i = 1; i <= 6; i++) {
        const t = monthStart(nd.getUTCFullYear(), nd.getUTCMonth() + i), md = new Date(t);
        const ps = periodsBetween(t, monthStart(md.getUTCFullYear(), md.getUTCMonth() + 1));
        const a = ps.reduce((o, p) => { const c = computePeriod(p); o.pay += c.pay; o.from += c.fromPay; o.save += c.savings; o.rem += c.remainder; return o; }, { pay: 0, from: 0, save: 0, rem: 0 });
        ahead.push({ y: md.getUTCFullYear(), m: md.getUTCMonth(), n: ps.length, ...a });
      }
      const tot = ahead.reduce((o, a) => { ['pay', 'from', 'save', 'rem'].forEach(k => o[k] += a[k]); return o; }, { pay: 0, from: 0, save: 0, rem: 0 });
      const cell = (v, extra = '') => `<td class="${v < 0 ? 'neg' : ''} ${extra}">${money(Math.round(v * 100) / 100) || '$0'}</td>`;
      const orow = (label, k, cls = '') => `<tr class="${cls}"><th>${label}</th>${ahead.map(a => cell(a[k])).join('')}${cell(tot[k], 'tot')}</tr>`;
      h += `<div class="overview"><div class="ov-title">Next 6 months</div><div class="ov-scroll"><table class="ov">
        <thead><tr><th></th>${ahead.map(a => `<th><button class="ov-month" data-goto="${a.y}-${a.m}" title="Show ${MONTHS[a.m]} ${a.y} in the sheet">${MONTHS[a.m]} ${a.y !== nd.getUTCFullYear() ? "'" + String(a.y).slice(2) : ''}<small>${a.n} paychecks</small></button></th>`).join('')}<th class="tot">6-mo total</th></tr></thead>
        <tbody>
          ${orow('Paychecks', 'pay')}
          ${orow('Paid from paycheck', 'from')}
          ${orow('Send to savings', 'save', 'ov-save')}
          ${orow('Remainder', 'rem', 'ov-rem')}
        </tbody></table></div></div>`;

      // table
      h += `<div class="sheet-wrap" id="sheetWrap"><table class="sheet"><thead><tr class="months">
        <th class="col-name" rowspan="2">Item</th><th class="col-due" rowspan="2">Due</th><th class="col-budget" rowspan="2">Budget/mo</th>`;
      months.forEach(mo => { if (mo.periods.length) h += `<th class="month" colspan="${mo.periods.length}">${MONTHS[mo.m]} ${mo.y}</th>`; });
      h += `</tr><tr class="dates">`;
      cols.forEach(c => { const d = new Date(fromISO(c.iso)); h += `<th class="${calc[c.iso].remainder < 0 ? 'hd-neg' : 'hd-pos'} ${c.monthEnd ? 'month-end' : ''} ${c.iso === nowP ? 'now' : ''}">${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}${c.iso === nowP ? ' · now' : ''}</th>`; });
      h += `</tr></thead><tbody>`;

      const inputCell = (id, c) => {
        const { v, carried } = cellValue(id, c.iso);
        const val = carried || v == null ? '' : plain(v);
        const ph = carried && v != null ? plain(v) : '';
        const k = v === 0 && !carried ? 'zero' : (v < 0 ? 'neg' : '');
        let bal = '', tip = '';
        if (id === 'paycheck') {
          const rem = calc[c.iso].remainder;
          bal = rem < 0 ? ' bal-neg' : ' bal-pos';
          tip = ` title="Remainder this paycheck: ${money(rem) || '$0'}"`;
        }
        const grip = v != null && v !== 0 && id !== 'paycheck' ? `<span class="grip" draggable="true" data-gid="${id}" data-gd="${c.iso}" title="Drag to move this amount to another pay period (hold Option to copy)">⠿</span>` : '';
        const sg = suggestion(id, c.iso);
        const nowP0 = currentPeriod();
        const needs = sg && sg.eligible && sg.short > 0.005 && sg.due >= nowP0;
        // the check that pays next month's bill (due before next month's first paycheck)
        const prevMonthCk = sg && sg.due >= nowP0 && sg.checks.includes(c.iso) && c.iso.slice(0, 7) !== sg.due.slice(0, 7);
        if (prevMonthCk && ((v || 0) > 0 || (sg.have === 0 && c.iso === sg.payer))) {
          bal += ' due-late';
          tip = ` title="Pays ${esc((itemInfo(id) || {}).name)} ${sg.label} (next month), so make this payment from the ${fmtDate(c.iso)} check. Planned ${money(sg.have) || '$0'} of ${money(sg.A)}."`;
        }
        if (needs) { bal += ' due-short'; tip = ` title="${esc((itemInfo(id) || {}).name)} ${sg.label}: needs ${money(sg.A)}, planned ${money(sg.have) || '$0'} — short ${money(sg.short)}${bal.includes('due-late') ? '. This bill is due next month, before its first paycheck, so pay it from this check.' : ''}"`; }
        const hint = needs ? `<button type="button" class="sugg" tabindex="-1" data-sid="${id}" data-sd="${c.iso}" title="Suggested ${money(sg.amt)} so ${money(sg.A)} ${sg.label} is covered. Double-click to use it.">?</button>` : '';
        return `<td class="${cls(c)}${bal}" data-cid="${id}" data-cd="${c.iso}"${tip}>${grip}${hint}<input class="${k}" data-id="${id}" data-d="${c.iso}" value="${esc(val)}" placeholder="${esc(ph)}" inputmode="decimal" autocomplete="off" aria-label="${esc((itemInfo(id) || {}).name)} ${c.iso}" /></td>`;
      };
      const calcCell = (c, v) => `<td class="${cls(c)}"><div class="calc ${v < 0 ? 'neg' : ''}">${money(v)}</div></td>`;
      const span = cols.length;

      // the first "paid from paycheck" section shows the paycheck boxes in its header
      const payHead = data.sections.find(x => x.fromPaycheck);
      const payHeadId = payHead ? payHead.id : null;
      // summary block (paycheck math)
      h += `<tr class="section-head"><td class="col-name"><div class="sec-title"><span class="sec-name" style="font-weight:600;letter-spacing:.04em;font-size:.85rem">Paycheck Summary</span></div></td><td class="col-due"></td><td class="col-budget"></td><td colspan="${span}"></td></tr>`;
      h += `<tr class="sum-row sum-pay"><td class="col-name"><button class="name-btn" data-special="paycheck"><span class="txt"><span class="nm">${esc(data.special.paycheck.name)}</span><span class="nt">${payHead ? 'Same as the ' + esc(payHead.name) + ' header' : 'Repeats every paycheck'}</span></span></button></td><td class="col-due"></td><td class="col-budget"></td>${cols.map(c => inputCell('paycheck', c)).join('')}</tr>`;
      h += `<tr class="sum-row"><td class="col-name"><span class="lbl">Paid from paycheck<small>Total of the paycheck sections</small></span></td><td class="col-due"></td><td class="col-budget"></td>${cols.map(c => calcCell(c, calc[c.iso].fromPay)).join('')}</tr>`;
      h += `<tr class="sum-row sum-save"><td class="col-name"><span class="lbl">Send to our Savings<small>Paycheck − paid from paycheck</small></span></td><td class="col-due"></td><td class="col-budget"></td>${cols.map(c => calcCell(c, calc[c.iso].savings)).join('')}</tr>`;
      h += `<tr class="sum-row sum-shared"><td class="col-name"><span class="lbl">Send to Shared<small>Shared lines + savings</small></span></td><td class="col-due"></td><td class="col-budget"></td>${cols.map(c => calcCell(c, calc[c.iso].sharedTotal)).join('')}</tr>`;
      h += `<tr class="sum-row"><td class="col-name"><button class="name-btn" data-special="withdraw"><span class="txt"><span class="nm">${esc(data.special.withdraw.name)}</span><span class="nt">Taken out of savings</span></span></button></td><td class="col-due"></td><td class="col-budget"></td>${cols.map(c => inputCell('withdraw', c)).join('')}</tr>`;
      h += `<tr class="sum-row sum-rem"><td class="col-name"><span class="lbl">Remainder<small>Savings − withdrawals</small></span></td><td class="col-due"></td><td class="col-budget"></td>${cols.map(c => calcCell(c, calc[c.iso].remainder)).join('')}</tr>`;

      data.sections.forEach(s => {
        h += `<tr class="spacer-row"><td class="col-name"></td><td class="col-due"></td><td class="col-budget"></td><td colspan="${span}"></td></tr>`;
        h += `<tr class="section-head"><td class="col-name"><div class="sec-title"><button class="sec-name" data-sec="${s.id}" title="Edit section">${esc(s.name)}</button><button class="add-line" data-add="${s.id}">+ Line</button></div></td><td class="col-due"></td><td class="col-budget">${s.id === payHeadId ? '<span class="tag">PAYCHECK&nbsp;→&nbsp;</span>' : s.fromPaycheck ? '<span class="tag">FROM PAYCHECK&nbsp;</span>' : ''}</td>${s.id === payHeadId ? cols.map(c => inputCell('paycheck', c)).join('') : `<td colspan="${span}"></td>`}</tr>`;
        let budgetTotal = 0;
        s.items.forEach(it => {
          budgetTotal += it.budget || 0;
          const chips = (it.repeat === 'every' ? '<span class="chip rep" title="Repeats every paycheck">↻ check</span>' : it.repeat === 'monthly' ? '<span class="chip rep" title="Repeats once a month">↻ month</span>' : it.repeat === 'quarterly' ? '<span class="chip rep" title="Repeats every 3 months">↻ 3 mo</span>' : it.repeat === 'semiannual' ? '<span class="chip rep" title="Repeats every 6 months">↻ 6 mo</span>' : it.repeat === 'yearly' ? '<span class="chip rep" title="Repeats once a year">↻ yearly</span>' : '')
            + (it.shared ? '<span class="chip shr" title="Included in Send to Shared">shared</span>' : '');
          h += `<tr><td class="col-name"><button class="name-btn${it.sub ? ' sub' : ''}" data-item="${it.id}" title="${esc(it.name)}${it.note ? ' — ' + esc(it.note) : ''}"><span class="txt"><span class="nm">${esc(it.name)}</span>${it.note ? `<span class="nt">${esc(it.note)}</span>` : ''}</span>${chips}</button></td>
            <td class="col-due">${dueHtml(it.due)}</td><td class="col-budget"><div class="budget-val">${money(it.budget)}</div></td>${cols.map(c => inputCell(it.id, c)).join('')}</tr>`;
        });
        h += `<tr class="add-row"><td class="col-name"><button class="add-exp" data-add="${s.id}"><span class="plus">+</span>Add expense</button></td><td class="col-due"></td><td class="col-budget"></td><td colspan="${span}"></td></tr>`;
        h += `<tr class="total-row"><td class="col-name">Total</td><td class="col-due"></td><td class="col-budget">${money(budgetTotal) || '$0'}</td>${cols.map(c => `<td class="${cls(c)}"><div class="calc">${money(calc[c.iso].sections[s.id], true)}</div></td>`).join('')}</tr>`;
        if (s.id === payHeadId) {
          h += `<tr class="diff-row"><td class="col-name"><span class="lbl">Difference<small>Paycheck − total · <span class="g">over</span> / <span class="r">short</span></small></span></td><td class="col-due"></td><td class="col-budget"></td>${cols.map(c => {
            const d = Math.round((calc[c.iso].pay - calc[c.iso].sections[s.id]) * 100) / 100;
            return `<td class="${cls(c)} ${d < 0 ? 'short' : 'over'}"><div class="calc">${d < 0 ? '−' : '+'}${money(Math.abs(d)) || '$0'}</div></td>`;
          }).join('')}</tr>`;
        }
      });
      h += `</tbody></table></div>`;
      h += `<p class="hint">Click a line's name to rename it, set its budget, or make it repeat. Repeating lines fill later periods automatically; type over any amount to change it, or clear a box to go back to the repeated amount.</p>`;

      const prevScroll = $('sheetWrap') ? $('sheetWrap').scrollTop : 0;
      app.innerHTML = h;
      $('sheetWrap').scrollTop = prevScroll;
    }

    function renderWelcome() {
      $('app').innerHTML = `<div class="welcome">
        <h2>Set up your budget</h2>
        <p>Import the data file made from your spreadsheet (<b>budget-data.json</b>), or start with an empty budget and add lines yourself.</p>
        <div class="row">
          <button class="btn primary" data-act="import">Import data file…</button>
          <button class="btn" data-act="blank">Start blank</button>
        </div></div>`;
    }

    function blankData() {
      const d = new Date(), a = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
      return { version: 1, anchor: toISO(a), periodDays: 14,
        special: { paycheck: { name: 'Paycheck (net)', repeat: 'every' }, withdraw: { name: 'Other withdrawals', repeat: 'off' } },
        sections: [
          { id: 'sec1', name: 'Monthly Bills', fromPaycheck: false, items: [] },
          { id: 'sec2', name: 'Paid from Paycheck', fromPaycheck: true, items: [] },
        ], values: {} };
    }

    function goToday() {
      const d = new Date(); let y = d.getFullYear(), m = d.getMonth() - 1;
      if (m < 0) { m = 11; y--; }
      view.start = { y, m };
    }
    function shift(n) {
      const d = new Date(monthStart(view.start.y, view.start.m + n));
      view.start = { y: d.getUTCFullYear(), m: d.getUTCMonth() };
    }

    // ── saving ──
    function setState(s, text) { $('saveState').dataset.s = s; $('saveText').textContent = text; }
    function banner(html) { const b = $('banner'); b.innerHTML = html || ''; b.classList.toggle('show', !!html); }
    function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({ rev, data })); } catch {} }

    function scheduleSave() {
      saveLocal();
      if (mode === 'local') { setState('local', 'Saved on this device'); return; }
      setState('saving', 'Saving…');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 700);
    }
    async function saveNow() {
      if (saving) { pendingSave = true; return; }
      saving = true;
      try {
        const res = await fetch(API, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rev, data }) });
        const body = await res.json().catch(() => ({}));
        if (res.ok) { rev = body.rev; saveLocal(); setState('ok', 'Saved'); banner(''); }
        else if (res.status === 409) {
          data = body.data; rev = body.rev; saveLocal(); render();
          setState('ok', 'Saved');
          banner('This budget was changed on another device, so the latest version was loaded. Please re-enter your last change if it is missing.');
        } else if (res.status === 501) { mode = 'local'; setState('local', 'Saved on this device'); banner(notConfiguredMsg); }
        else { setState('error', 'Not saved'); banner('Could not save to the server (' + esc(body.error || res.status) + '). Your changes are kept on this device; they will save on your next edit.'); }
      } catch {
        setState('error', 'Not saved'); banner('No connection. Your changes are kept on this device and will save on your next edit.');
      } finally {
        saving = false;
        if (pendingSave) { pendingSave = false; saveNow(); }
      }
    }
    const notConfiguredMsg = 'Online storage isn\'t set up yet (BUDGET_KV), so this budget is only saved in this browser on this device.';

    // One-time layout updates applied to saved budgets (runs once per budget).
    function migrate(d) {
      if (!d || !Array.isArray(d.sections)) return false;
      d.migrations = d.migrations || {};
      let changed = false;
      if (!d.migrations.indentGirl) {
        // Diapers, wipes, dance class, stem cell sit under the girl/baby expenses line
        d.sections.forEach(s => s.items.forEach(it => { if (['r63', 'r64', 'r65', 'r66'].includes(it.id)) it.sub = true; }));
        d.migrations.indentGirl = true; changed = true;
      }
      if (!d.migrations.dueFromNames) {
        d.sections.forEach(s => s.items.forEach(it => {
          if (it.due) return;
          const m = String(it.name).match(/\b(\d{1,2})(st|nd|rd|th)\b/i);
          if (!m || +m[1] < 1 || +m[1] > 31) return;
          it.due = String(+m[1]);
          const parts = it.name.split(/\s*-[\s-]*/).map(x => x.trim()).filter(x => x && x.toLowerCase() !== m[0].toLowerCase());
          if (parts.length) it.name = parts.join(' · ');
        }));
        d.migrations.dueFromNames = true; changed = true;
      }
      if (d.migrations.splitUnplanned) return changed;
      const i = d.sections.findIndex(s => s.name === 'Projected & Unplanned');
      if (i >= 0) {
        const src = d.sections[i];
        src.name = 'Projected';
        const ids = ['r94', 'r95', 'r98', 'r99', 'r100', 'r101']; // Refrigerator, A/C, medical bills
        const moved = src.items.filter(it => ids.includes(it.id));
        src.items = src.items.filter(it => !ids.includes(it.id));
        d.sections.splice(i + 1, 0, { id: 'unplanned', name: 'Unplanned', fromPaycheck: false, items: moved });
      }
      if (!d.sections.some(s => s.name === 'Emergency Fund')) {
        d.sections.push({ id: 'emergency', name: 'Emergency Fund', fromPaycheck: false, items: [] });
      }
      d.migrations.splitUnplanned = true;
      return true;
    }

    async function load() {
      goToday();
      let local = null;
      try { local = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch {}
      try {
        const res = await fetch(API, { cache: 'no-store' });
        if (res.status === 501 || res.status === 404) throw Object.assign(new Error('nc'), { nc: true });
        if (!res.ok) throw new Error('http ' + res.status);
        const body = await res.json();
        rev = body.rev || 0; data = body.data;
        if (!data && local && local.data) {
          // first time online: offer to move browser-only data to the server
          data = local.data; rev = 0; migrate(data); scheduleSave();
        } else { saveLocal(); setState('ok', 'Saved'); if (migrate(data)) scheduleSave(); }
      } catch (e) {
        mode = 'local';
        data = local && local.data || null; rev = local && local.rev || 0;
        setState('local', 'Saved on this device');
        if (migrate(data)) saveLocal();
        banner(e.nc ? notConfiguredMsg : 'Can\'t reach the server right now — showing the copy saved on this device.');
      }
      render();
    }

    // ── events ──
    document.addEventListener('click', (e) => {
      const t = e.target.closest('[data-act],[data-item],[data-special],[data-sec],[data-add],[data-goto]');
      if (!$('menu').contains(e.target)) $('menu').classList.remove('open');
      if (!t) return;
      if (t.dataset.act === 'prev') { shift(-1); render(); }
      else if (t.dataset.act === 'next') { shift(1); render(); }
      else if (t.dataset.act === 'today') { goToday(); render(); }
      else if (t.dataset.goto) { const [y, m] = t.dataset.goto.split('-').map(Number); view.start = { y, m }; render(); $('sheetWrap').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      else if (t.dataset.act === 'import') $('fileInput').click();
      else if (t.dataset.act === 'blank') { data = blankData(); scheduleSave(); render(); }
      else if (t.dataset.item) openItem(t.dataset.item);
      else if (t.dataset.special) openSpecial(t.dataset.special);
      else if (t.dataset.sec) openSection(t.dataset.sec);
      else if (t.dataset.add) openItem(null, t.dataset.add);
    });
    document.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset && t.dataset.act === 'months') {
        view.months = +t.value; try { localStorage.setItem(LS_VIEW, JSON.stringify({ months: view.months })); } catch {}
        render(); return;
      }
      if (t.matches('.cell input')) commitCell(t);
    });
    document.addEventListener('keydown', (e) => {
      const t = e.target;
      if (!t.matches || !t.matches('.cell input')) return;
      if (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const td = t.closest('td'), tr = td.parentElement, idx = [...tr.children].indexOf(td);
        let row = tr;
        do { row = e.key === 'ArrowUp' ? row.previousElementSibling : row.nextElementSibling; }
        while (row && !(row.children[idx] && row.children[idx].querySelector('input')));
        const target = row && row.children[idx].querySelector('input');
        const key = target && [target.dataset.id, target.dataset.d];
        commitCell(t, () => {
          if (key) { const n = document.querySelector(`.cell input[data-id="${key[0]}"][data-d="${key[1]}"]`); if (n) { n.focus(); n.select(); } }
          else if (document.activeElement) document.activeElement.blur();
        });
      } else if (e.key === 'Escape') { t.value = t.defaultValue; t.blur(); }
    });

    let applyPending = null; // {resolve} while the apply-to prompt is open

    // later pay dates (up to ~3 years) for scanning the future
    function futurePeriods(iso) {
      const t = fromISO(iso) + DAY;
      return periodsBetween(t, t + 3 * 366 * DAY);
    }
    const fmtDate = (iso) => { const d = new Date(fromISO(iso)); return `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`; };

    function redraw() {
      const sl = $('sheetWrap') ? $('sheetWrap').scrollLeft : 0;
      render();
      if ($('sheetWrap')) $('sheetWrap').scrollLeft = sl;
      scheduleSave();
    }

    function commitCell(input, after) {
      const done = () => { if (after) after(); };
      if (applyPending) return; // prompt already open for this edit
      const id = input.dataset.id, iso = input.dataset.d;
      if (!data.values) data.values = {};
      const cur = (data.values[id] || {})[iso];
      const n = parseAmt(input.value);
      if (Number.isNaN(n)) { input.value = input.defaultValue; input.animate([{ background: '#fde2e2' }, { background: 'transparent' }], 700); done(); return; }
      if ((n === null && cur === undefined) || n === cur) { done(); return; }

      const before = cellValue(id, iso).v;
      const it = itemInfo(id) || {};
      const repeats = it.repeat && it.repeat !== 'off';
      const future = futurePeriods(iso);
      const vals = data.values[id] || {};
      const sameLater = Object.keys(vals).filter(d => d > iso); // every later box that has its own amount

      // Clearing a box, or a one-off line with nothing later to update: just save it.
      if (n === null || (!repeats && sameLater.length === 0) || before === n) {
        setValue(id, iso, n); redraw(); done(); return;
      }

      const name = it.name || 'this line';
      $('applyText').innerHTML = before != null
        ? `<b>${esc(name)}</b>: ${money(before)} → <b>${money(n)}</b> on ${fmtDate(iso)}.`
        : `<b>${esc(name)}</b>: <b>${money(n)}</b> on ${fmtDate(iso)}.`;
      $('applyOne').innerHTML = `Just ${fmtDate(iso)}<small>Later pay periods keep ${before != null ? 'their current amount' : 'what they have now'}</small>`;
      $('applyFuture').innerHTML = `${fmtDate(iso)} and all future<small>Every later pay period for this line becomes ${money(n)}</small>`;

      applyPending = { id, iso, n, before, future, sameLater, input, done };
      $('applyDlg').showModal();
      $('applyFuture').focus();
    }

    // Amount per occurrence implied by a monthly budget
    function perOccurrence(budget, repeat) {
      const mult = { every: 0.5, monthly: 1, quarterly: 3, semiannual: 6, yearly: 12 }[repeat] || 1;
      return Math.round(budget * mult * 100) / 100;
    }
    const occLabel = { every: 'each paycheck', monthly: 'each month', quarterly: 'every 3 months', semiannual: 'every 6 months', yearly: 'once a year' };

    function askBudgetApply(it, oldBudget) {
      const amt = perOccurrence(it.budget, it.repeat);
      const nowP = currentPeriod();
      $('applyText').innerHTML = `<b>${esc(it.name)}</b> budget: ${oldBudget != null ? money(oldBudget) + ' → ' : ''}<b>${money(it.budget)}</b>/mo.<br>Update the amounts in the pay-period boxes too?`;
      $('applyOne').innerHTML = `Only change the budget number<small>The boxes keep their amounts</small>`;
      $('applyFuture').innerHTML = `Update boxes from ${fmtDate(nowP)} onward<small>${money(amt)} ${occLabel[it.repeat] || ''}${it.repeat === 'every' ? ' (half the monthly budget)' : ''}; earlier boxes stay as they are</small>`;
      applyPending = { kind: 'budget', id: it.id, amt };
      $('applyDlg').showModal();
      $('applyFuture').focus();
    }

    // Set this line's amount from the current pay period onward
    function applyBudget(id, amt) {
      const nowP = currentPeriod();
      const periods = [nowP, ...futurePeriods(nowP)];
      const anchor = periods.find(d => { const v = cellValue(id, d).v; return v != null && v !== 0; }) || nowP;
      const vals = data.values[id] || {};
      Object.keys(vals).forEach(d => { if (d > anchor) setValue(id, d, amt); });
      setValue(id, anchor, amt);
    }

    // Set one pay period without changing what later periods show
    function setOnlyThis(id, iso, n) {
      const snap = futurePeriods(iso).map(d => [d, cellValue(id, d)]);
      setValue(id, iso, n);
      for (const [d, old] of snap) {
        const now = cellValue(id, d);
        if (!now.carried) { if ((data.values[id] || {})[d] !== undefined) break; else continue; }
        if (now.v !== old.v) { setValue(id, d, old.v == null ? 0 : old.v); break; }
      }
    }

    // Suggested amount: monthly budget split across the paychecks in that month
    // ── bill planning: which paychecks pay each bill, based on the Due column ──
    const MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
    const everyMonths = { quarterly: 3, semiannual: 6, yearly: 12 };
    const mIdx = (iso) => (+iso.slice(0, 4)) * 12 + (+iso.slice(5, 7) - 1);
    const dueOn = (mi, day) => { const y = Math.floor(mi / 12), m = mi % 12, dim = new Date(Date.UTC(y, m + 1, 0)).getUTCDate(); return toISO(Date.UTC(y, m, Math.min(day, dim))); };
    function dueRule(it) {
      const t = String(it.due || '').trim();
      let m;
      if (/^\d{1,2}$/.test(t) && +t >= 1 && +t <= 31) {
        const F = everyMonths[it.repeat] || 1;
        let anchor = 0;
        if (F > 1) { const ds = explicitDates(it.id).filter(d => data.values[it.id][d]); anchor = ds.length ? mIdx(ds[0]) : mIdx(toISO(todayUTC())); }
        return { day: +t, F, anchor };
      }
      if (/^(eom|end of month|last day)/i.test(t)) return { day: 31, F: everyMonths[it.repeat] || 1, anchor: 0 };
      if ((m = t.match(/^([a-z]{3})[a-z]*\.?\s+(\d{1,2})/i)) && MON[m[1].toLowerCase()] != null) {
        return { day: +m[2], F: everyMonths[it.repeat] && everyMonths[it.repeat] < 12 ? everyMonths[it.repeat] : 12, anchor: MON[m[1].toLowerCase()] };
      }
      if (everyMonths[it.repeat]) { // e.g. "Quarterly" with no day: due at the end of the cycle month
        const F = everyMonths[it.repeat], ds = explicitDates(it.id).filter(d => data.values[it.id][d]);
        return { day: 31, F, anchor: ds.length ? mIdx(ds[0]) : mIdx(toISO(todayUTC())) };
      }
      return null; // no usable due date: plan by calendar month
    }
    // Which bill this pay period helps pay: the next due date on/after it.
    // A bill is paid by the checks that arrive after the previous due date and on/before its own due date.
    function billWindow(id, iso) {
      const it = itemInfo(id);
      if (!it || !it.budget || data.special[id]) return null;
      const r = dueRule(it);
      if (r) {
        const ok = (mi) => (((mi - r.anchor) % r.F) + r.F) % r.F === 0;
        let mi = mIdx(iso);
        for (let k = 0; k < 30; k++, mi++) { if (ok(mi) && dueOn(mi, r.day) >= iso) break; }
        const due = dueOn(mi, r.day), prev = dueOn(mi - r.F, r.day);
        const checks = periodsBetween(fromISO(prev) + DAY, fromISO(due) + DAY);
        if (!checks.length) return null;
        const payer = checks[checks.length - 1];                // last check before the bill is due
        const cross = payer.slice(0, 7) !== due.slice(0, 7);   // paid in the month before it's due
        const A = Math.round(it.budget * r.F * 100) / 100;
        return { it, A, checks, eligible: [payer], payer, cross, due, label: `due ${fmtDate(due)}` };
      }
      // no day in the Due column: one bill per calendar month, spread over that month's checks
      const checks = periodsInMonth(iso);
      if (!checks.length) return null;
      const d = new Date(fromISO(iso));
      const due = toISO(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0));
      return { it, A: it.budget, checks, eligible: checks, payer: null, cross: false, due, label: `for ${MONTHS[d.getUTCMonth()]}` };
    }
    function suggestion(id, iso) {
      const w = billWindow(id, iso); if (!w) return null;
      const have = Math.round(w.checks.reduce((t, c) => t + (cellValue(id, c).v || 0), 0) * 100) / 100;
      const short = Math.round((w.A - have) * 100) / 100;
      const idx = w.eligible.indexOf(iso), n = w.eligible.length;
      let amt = null;
      if (idx >= 0) {
        const share = short > 0 ? Math.floor(short / n * 100) / 100 : 0;
        const add = idx === n - 1 ? Math.round((short - share * (n - 1)) * 100) / 100 : share;
        amt = Math.round(((cellValue(id, iso).v || 0) + Math.max(add, 0)) * 100) / 100;
      }
      return { amt, eligible: idx >= 0, n, A: w.A, label: w.label, due: w.due, cross: w.cross, payer: w.payer, checks: w.checks, have, short, budget: w.it.budget };
    }

    function finishApply(choice) {
      const p = applyPending; if (!p) return;
      applyPending = null;
      $('applyDlg').close();
      if (p.kind === 'budget') { if (choice === 'future') applyBudget(p.id, p.amt); render(); scheduleSave(); return; }
      if (choice === 'cancel') { p.input.value = p.input.defaultValue; p.input.focus(); return; }
      const { id, iso, n, before, future, sameLater } = p;
      if (choice === 'one') {
        setOnlyThis(id, iso, n);
      } else {
        setValue(id, iso, n);
        sameLater.forEach(d => setValue(id, d, n));
      }
      redraw();
      p.done();
    }
    $('applyOne').addEventListener('click', () => finishApply('one'));
    $('applyFuture').addEventListener('click', () => finishApply('future'));
    $('applyCancel').addEventListener('click', () => finishApply('cancel'));
    $('applyDlg').addEventListener('cancel', (e) => { e.preventDefault(); finishApply('cancel'); });

    // ── suggested amount: click shows it, double-click enters it ──
    function closeSugg() { document.querySelectorAll('.sugg-pop').forEach(el => el.remove()); }
    document.addEventListener('click', (e) => {
      const b = e.target.closest && e.target.closest('.sugg');
      if (!b) { closeSugg(); return; }
      e.preventDefault(); e.stopPropagation();
      const open = b.parentElement.querySelector('.sugg-pop');
      closeSugg(); if (open) return;
      const sg = suggestion(b.dataset.sid, b.dataset.sd); if (!sg) return;
      const pop = document.createElement('div'); pop.className = 'sugg-pop';
      const nm = esc(itemInfo(b.dataset.sid).name);
      pop.innerHTML = `Suggested <b>${money(sg.amt)}</b><small>${nm} ${sg.label}: ${money(sg.A)} · planned ${money(sg.have) || '$0'} · short ${money(sg.short)}</small>${sg.cross ? '<small style="color:#ff8a80">Due next month, before its first paycheck — pay it from this check</small>' : ''}<small>Double-click ? to use it</small>`;
      b.parentElement.appendChild(pop);
    }, true);
    document.addEventListener('dblclick', (e) => {
      const b = e.target.closest && e.target.closest('.sugg'); if (!b) return;
      e.preventDefault();
      const sg = suggestion(b.dataset.sid, b.dataset.sd); if (!sg) return;
      closeSugg();
      setOnlyThis(b.dataset.sid, b.dataset.sd, sg.amt);
      redraw();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSugg(); });

    // ── drag an amount to another pay period (same line) ──
    let drag = null;
    document.addEventListener('dragstart', (e) => {
      const g = e.target.closest && e.target.closest('.grip'); if (!g) return;
      drag = { id: g.dataset.gid, d: g.dataset.gd };
      e.dataTransfer.effectAllowed = 'copyMove';
      e.dataTransfer.setData('text/plain', drag.id + '|' + drag.d);
      const td = g.closest('td'); td.classList.add('drag-src'); td.parentElement.classList.add('drag-row');
    });
    document.addEventListener('dragend', () => {
      drag = null;
      document.querySelectorAll('.drag-src,.drag-row,.drop-target').forEach(el => el.classList.remove('drag-src', 'drag-row', 'drop-target'));
    });
    const dropCell = (e) => { const td = e.target.closest && e.target.closest('td.cell[data-cid]'); return td && drag && td.dataset.cid === drag.id && td.dataset.cd !== drag.d ? td : null; };
    document.addEventListener('dragover', (e) => {
      const td = dropCell(e); if (!td) return;
      e.preventDefault(); e.dataTransfer.dropEffect = e.altKey ? 'copy' : 'move';
      document.querySelectorAll('.drop-target').forEach(el => el !== td && el.classList.remove('drop-target'));
      td.classList.add('drop-target');
    });
    document.addEventListener('dragleave', (e) => { const td = e.target.closest && e.target.closest('td.drop-target'); if (td && !td.contains(e.relatedTarget)) td.classList.remove('drop-target'); });
    document.addEventListener('drop', (e) => {
      const td = dropCell(e); if (!td) return;
      e.preventDefault();
      moveAmount(drag.id, drag.d, td.dataset.cd, e.altKey);
    });

    function moveAmount(id, from, to, copy) {
      const amt = cellValue(id, from).v; if (amt == null || amt === 0) return;
      const it = itemInfo(id) || {}, repeats = it.repeat && it.repeat !== 'off';
      // remember every other pay period so only the dragged amount moves
      const start = from < to ? from : to;
      const others = futurePeriods(start).filter(d => d !== from && d !== to).map(d => [d, cellValue(id, d)]);
      const target = cellValue(id, to).v || 0;
      setValue(id, to, Math.round((target + amt) * 100) / 100);
      if (!copy) setValue(id, from, repeats ? 0 : null);
      for (const [d, old] of others) {
        const now = cellValue(id, d);
        if (now.v !== old.v) setValue(id, d, old.v == null ? (repeats ? 0 : null) : old.v);
      }
      redraw();
    }

    $('menuBtn').addEventListener('click', (e) => { e.stopPropagation(); $('menu').classList.toggle('open'); });
    $('mExport').addEventListener('click', () => {
      if (!data) return;
      const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `budget-backup-${toISO(todayUTC())}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      $('menu').classList.remove('open');
    });
    $('mImport').addEventListener('click', () => { $('menu').classList.remove('open'); $('fileInput').click(); });
    $('mAddSection').addEventListener('click', () => { $('menu').classList.remove('open'); if (data) openSection(null); });
    $('fileInput').addEventListener('change', async (e) => {
      const f = e.target.files[0]; e.target.value = '';
      if (!f) return;
      try {
        const d = JSON.parse(await f.text());
        if (d.version !== 1 || !Array.isArray(d.sections) || !d.anchor || !d.special) throw new Error('format');
        d.values = d.values || {};
        if (data && !confirm('Replace the current budget with the imported file? (Download a backup first if unsure.)')) return;
        data = d; migrate(data); scheduleSave(); render();
      } catch { alert('That file is not a budget data file.'); }
    });

    // ── item dialog ──
    let editing = null; // {kind:'item'|'special', id, sectionId}
    function findItem(id) {
      for (const s of data.sections) { const i = s.items.findIndex(x => x.id === id); if (i >= 0) return { s, i, it: s.items[i] }; }
      return null;
    }
    function openItem(id, sectionId) {
      const f = id ? findItem(id) : null;
      editing = { kind: 'item', id, sectionId: f ? f.s.id : sectionId };
      const it = f ? f.it : { name: '', note: '', budget: null, repeat: 'off', shared: false };
      $('itemDlgTitle').textContent = id ? 'Edit line' : 'New line';
      $('fName').value = it.name; $('fNote').value = it.note || ''; $('fBudget').value = it.budget == null ? '' : plain(it.budget); $('fDue').value = it.due == null ? '' : it.due;
      $('fRepeat').value = it.repeat || 'off'; $('fShared').checked = !!it.shared; $('fSub').checked = !!it.sub;
      ['fNote', 'fDue', 'fBudget', 'fShared', 'fSub', 'fUp', 'fDown'].forEach(k => $(k).closest('label, button').style.display = '');
      $('fSection').innerHTML = data.sections.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
      $('fSection').value = editing.sectionId; $('fSecWrap').style.display = '';
      $('fDelete').style.display = id ? '' : 'none';
      $('fUp').style.display = $('fDown').style.display = id ? '' : 'none';
      $('itemDlg').showModal(); $('fName').focus();
    }
    function openSpecial(key) {
      editing = { kind: 'special', id: key };
      const sp = data.special[key];
      $('itemDlgTitle').textContent = 'Edit line';
      $('fName').value = sp.name; $('fRepeat').value = sp.repeat || 'off';
      ['fNote', 'fDue', 'fBudget', 'fShared', 'fSub', 'fSection'].forEach(k => $(k).closest('label').style.display = 'none');
      ['fUp', 'fDown', 'fDelete'].forEach(k => $(k).style.display = 'none');
      $('itemDlg').showModal(); $('fName').focus();
    }
    $('itemForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = $('fName').value.trim(); if (!name) return;
      if (editing.kind === 'special') {
        Object.assign(data.special[editing.id], { name, repeat: $('fRepeat').value });
      } else {
        const b = parseAmt($('fBudget').value);
        const dueRaw = $('fDue').value.trim().replace(/^(\d{1,2})(st|nd|rd|th)$/i, '$1');
        const vals = { name, due: dueRaw, note: $('fNote').value.trim(), budget: Number.isNaN(b) ? null : b, repeat: $('fRepeat').value, shared: $('fShared').checked, sub: $('fSub').checked };
        const target = data.sections.find(s => s.id === $('fSection').value) || data.sections.find(s => s.id === editing.sectionId);
        let askBudget = null;
        if (editing.id) {
          const f = findItem(editing.id);
          const oldBudget = f.it.budget;
          Object.assign(f.it, vals);
          if (target && target !== f.s) { f.s.items.splice(f.i, 1); target.items.push(f.it); }
          if (vals.budget != null && vals.budget !== oldBudget && vals.repeat !== 'off') askBudget = { it: f.it, oldBudget };
        } else target.items.push({ id: uid(), ...vals });
        if (askBudget) { $('itemDlg').close(); render(); scheduleSave(); askBudgetApply(askBudget.it, askBudget.oldBudget); return; }
      }
      $('itemDlg').close(); render(); scheduleSave();
    });
    $('fCancel').addEventListener('click', () => $('itemDlg').close());
    $('fDelete').addEventListener('click', () => {
      const f = findItem(editing.id); if (!f) return;
      if (!confirm(`Delete "${f.it.name}" and all its amounts?`)) return;
      f.s.items.splice(f.i, 1); delete data.values[editing.id];
      $('itemDlg').close(); render(); scheduleSave();
    });
    function moveItem(dir) {
      const f = findItem(editing.id); const j = f.i + dir;
      if (j < 0 || j >= f.s.items.length) return;
      [f.s.items[f.i], f.s.items[j]] = [f.s.items[j], f.s.items[f.i]]; render(); scheduleSave();
    }
    $('fUp').addEventListener('click', () => moveItem(-1));
    $('fDown').addEventListener('click', () => moveItem(1));

    // ── section dialog ──
    let editingSec = null;
    function openSection(id) {
      editingSec = id;
      const s = id ? data.sections.find(x => x.id === id) : { name: '', fromPaycheck: false };
      $('secDlgTitle').textContent = id ? 'Edit section' : 'New section';
      $('sName').value = s.name; $('sFromPay').checked = !!s.fromPaycheck;
      ['sUp', 'sDown', 'sDelete'].forEach(k => $(k).style.display = id ? '' : 'none');
      $('secDlg').showModal(); $('sName').focus();
    }
    $('secForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = $('sName').value.trim(); if (!name) return;
      if (editingSec) Object.assign(data.sections.find(x => x.id === editingSec), { name, fromPaycheck: $('sFromPay').checked });
      else data.sections.push({ id: uid(), name, fromPaycheck: $('sFromPay').checked, items: [] });
      $('secDlg').close(); render(); scheduleSave();
    });
    $('sCancel').addEventListener('click', () => $('secDlg').close());
    $('sDelete').addEventListener('click', () => {
      const i = data.sections.findIndex(x => x.id === editingSec), s = data.sections[i];
      if (s.items.length && !confirm(`Delete section "${s.name}" and its ${s.items.length} lines?`)) return;
      s.items.forEach(it => delete data.values[it.id]);
      data.sections.splice(i, 1); $('secDlg').close(); render(); scheduleSave();
    });
    function moveSec(dir) {
      const i = data.sections.findIndex(x => x.id === editingSec), j = i + dir;
      if (j < 0 || j >= data.sections.length) return;
      [data.sections[i], data.sections[j]] = [data.sections[j], data.sections[i]]; render(); scheduleSave();
    }
    $('sUp').addEventListener('click', () => moveSec(-1));
    $('sDown').addEventListener('click', () => moveSec(1));

    // test hook
    window.__budget = { computePeriod: (iso) => computePeriod(iso), get data() { return data; }, cellValue: (id, iso) => cellValue(id, iso) };

    load();
  })();
  </script>
</body>
</html>
