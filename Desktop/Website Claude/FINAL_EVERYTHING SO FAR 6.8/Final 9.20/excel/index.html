  <style>
    :root {
      --navy: #0d1e4a; --navy-dark: #091535;
      --gold: #c9a05a; --gold-ink: #8a6420;
      --page: #f3f1ec; --card: #ffffff; --line: #e3dfd6; --line-strong: #cfc8b9;
      --ink: #1c232b; --muted: #6b7480; --neg: #b3261e;
      --past: #f7f6f2; --now: #fdf6e7;
      --row-pay: #eef3fb; --row-save: #fff3bf; --row-shared: #fbe9c6; --row-rem: #ebe3f7; --row-total: #f4f1ea;
      --stick-w: 290px; --due-w: 70px; --budget-w: 104px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', sans-serif; background: var(--page); color: var(--ink); min-height: 100vh; font-size: 14px; }
    button, input, select { font: inherit; color: inherit; }

    /* ── top bar ── */
    .topbar { background: var(--navy-dark); color: #f8f5ef; display: flex; align-items: center; gap: 1rem; padding: 0.8rem 1.25rem; position: sticky; top: 0; z-index: 30; }
    .topbar img { height: 38px; display: block; }
    .topbar h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.6rem; letter-spacing: 0.01em; margin-right: auto; }
    .save-state { font-size: 0.72rem; letter-spacing: 0.06em; color: #c8c0b0; display: flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
    .save-state::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #6fbf73; }
    .save-state[data-s="saving"]::before { background: var(--gold); }
    .save-state[data-s="local"]::before, .save-state[data-s="error"]::before { background: #e57373; }
    .undo-btn { display: inline-flex; align-items: center; gap: 0.35rem; background: transparent; border: 1px solid rgba(201,160,90,0.4); color: #f8f5ef; border-radius: 6px; padding: 0.35rem 0.65rem; cursor: pointer; font-size: 0.78rem; }
    .undo-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
    .undo-btn:disabled { opacity: 0.35; cursor: default; }
    .menu-btn { white-space: nowrap; background: transparent; border: 1px solid rgba(201,160,90,0.4); color: #f8f5ef; border-radius: 6px; padding: 0.4rem 0.7rem; cursor: pointer; font-size: 0.78rem; }
    .menu-btn:hover { border-color: var(--gold); color: var(--gold); }
    .menu { position: relative; }
    .menu-list { display: none; position: absolute; right: 0; top: calc(100% + 6px); background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.18); min-width: 220px; padding: 0.35rem; }
    .menu.open .menu-list { display: block; }
    .menu-list button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0.55rem 0.7rem; border-radius: 5px; cursor: pointer; font-size: 0.85rem; }
    .menu-list button:hover { background: var(--page); }
    .menu-list a { display: block; padding: 0.55rem 0.7rem; color: var(--ink); text-decoration: none; font-size: 0.85rem; border-radius: 5px; }
    .menu-list a:hover { background: var(--page); }

    main { padding: 1rem 1.25rem; width: 100%; }

    .banner { display: none; background: #fff4e5; border: 1px solid #f0c98a; color: #6b4a12; padding: 0.7rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; }
    .banner.show { display: block; }

    /* ── controls ── */
    .controls { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .range-label { font-weight: 600; font-size: 1.05rem; min-width: 12rem; text-align: center; }
    .btn { background: var(--card); border: 1px solid var(--line-strong); border-radius: 6px; padding: 0.45rem 0.8rem; cursor: pointer; font-size: 0.82rem; }
    .btn:hover { border-color: var(--gold); }
    .btn.icon { width: 2.2rem; padding: 0.45rem 0; text-align: center; }
    .btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
    .btn.primary:hover { background: var(--navy-dark); }
    .btn.danger { color: var(--neg); }
    .controls select { background: var(--card); border: 1px solid var(--line-strong); border-radius: 6px; padding: 0.42rem 0.5rem; font-size: 0.82rem; }
    .spacer { flex: 1; }

    /* ── stats ── */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem 0.9rem; }
    .stat .k { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    .stat .v { font-size: 1.25rem; font-weight: 700; margin-top: 0.25rem; font-variant-numeric: tabular-nums; }
    .stat .v.neg { color: var(--neg); }
    .stat .v.pos { color: #2e7d32; }
    .stat-per .k { text-transform: none; letter-spacing: 0.02em; font-size: 0.9rem; font-weight: 600; color: var(--ink); }
    .stat-per.cur { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
    html.dark .stat .v.pos { color: #7fd18a; }

    /* ── difference row under the paycheck section total ── */
    tr.diff-row td, tr.diff-row td.col-name, tr.diff-row td.col-due, tr.diff-row td.col-budget { background: #fbfaf7; }
    tr.diff-row td.col-name .lbl { padding-left: 0.8rem; font-weight: 600; font-size: 0.94rem; display: block; }
    tr.diff-row td.col-name .lbl small { display: block; font-weight: 400; font-size: 0.74rem; color: var(--muted); }
    tr.diff-row .g { color: #2e7d32; font-weight: 600; } tr.diff-row .r { color: var(--neg); font-weight: 600; }
    .sheet tr.diff-row td.cell.over, .sheet tr.diff-row td.cell.over.past, .sheet tr.diff-row td.cell.over.now { background: #dcf1dc; }
    .sheet tr.diff-row td.cell.short, .sheet tr.diff-row td.cell.short.past, .sheet tr.diff-row td.cell.short.now { background: #f8d7d5; }
    tr.diff-row td.cell.over .calc { color: #2e7d32; font-weight: 700; }
    .sheet tr.sum-rem td.cell.over, .sheet tr.sum-rem td.cell.over.past, .sheet tr.sum-rem td.cell.over.now { background: #dcf1dc; }
    .sheet tr.sum-rem td.cell.short, .sheet tr.sum-rem td.cell.short.past, .sheet tr.sum-rem td.cell.short.now { background: #f8d7d5; }
    tr.sum-rem td.cell.over .calc { color: #2e7d32; font-weight: 700; }
    tr.sum-rem td.cell.short .calc { color: var(--neg); font-weight: 700; }
    tr.diff-row td.cell.short .calc { color: var(--neg); font-weight: 700; }

    /* ── balance colors on paycheck cells ── */
    .sheet td.cell.bal-pos, tr.section-head td.cell.bal-pos, tr.sum-pay td.cell.bal-pos { background: #dcf1dc !important; }
    .sheet td.cell.bal-neg, tr.section-head td.cell.bal-neg, tr.sum-pay td.cell.bal-neg { background: #f8d7d5 !important; }
    tr.section-head td.cell.bal-pos input, tr.section-head td.cell.bal-neg input { color: var(--ink); }
    tr.section-head td.cell.bal-pos input::placeholder, tr.section-head td.cell.bal-neg input::placeholder { color: var(--ink); }
    .sheet td.cell.bal-neg input, .sheet td.cell.bal-neg input::placeholder { color: var(--neg); }
    .sheet thead tr.dates th.hd-pos { box-shadow: inset 0 -3px 0 #7cc47f; }
    .sheet thead tr.dates th.hd-neg { box-shadow: inset 0 -3px 0 #e06b63; color: var(--neg); }

    /* ── suggested amount "?" ── */
    .sugg { position: absolute; top: 2px; right: 2px; width: 13px; height: 13px; border-radius: 50%; border: 0; background: #ece7db; color: var(--gold-ink); font-size: 0.55rem; font-weight: 700; line-height: 13px; padding: 0; cursor: pointer; z-index: 3; opacity: 0.55; }
    .sheet td.cell:hover .sugg { opacity: 1; }
    .sugg:hover { background: var(--gold); color: #fff; }
    .sugg-pop { position: absolute; top: 16px; right: 2px; z-index: 20; background: var(--navy-dark); color: #fff; border-radius: 6px; padding: 0.45rem 0.6rem; font-size: 0.72rem; line-height: 1.4; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,0.25); text-align: left; pointer-events: auto; cursor: default; }
    .sugg-pop b { color: var(--gold-light, #dbb97a); font-size: 0.85rem; }
    .sugg-pop .sp-acts { display: flex; gap: 0.35rem; margin-top: 0.4rem; }
    .sugg-pop .sp-acts button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.45); border-radius: 5px; padding: 0.2rem 0.5rem; font-size: 0.68rem; cursor: pointer; }
    .sugg-pop .sp-acts button:hover { border-color: var(--gold); color: var(--gold); }
    .sugg-pop small { display: block; color: #c8c0b0; font-size: 0.66rem; }

    /* ── bill not fully planned before its due date ── */
    .sheet td.cell.due-short { background: #ffe1bd !important; box-shadow: inset 0 0 0 1px #f0a24a; }
    .sheet td.cell.due-short .sugg { opacity: 1; background: #f0a24a; color: #fff; }

    /* ── bill due before the month's first paycheck ── */
    .sheet td.cell.due-late { box-shadow: inset 0 0 0 2px #d93025 !important; }
    .sheet td.cell.due-late::after { content: '!'; position: absolute; left: 3px; bottom: 1px; font-size: 0.6rem; font-weight: 800; color: #d93025; }

    /* ── crosshair while editing: light blue bands laid over the row and column ── */
    #sheetWrap .sheet tr.xh-row > td::before, #sheetWrap .sheet .xh-col::before { content: ''; position: absolute; inset: 0; background: rgba(61, 155, 233, 0.18); pointer-events: none; z-index: 1; }
    #sheetWrap .sheet tr.xh-row > td.xh-col::before { background: transparent; box-shadow: inset 0 0 0 2px #3d9be9; }

    /* ── multi-select + sum badge ── */
    #sheetWrap .sheet td.cell.ro { cursor: cell; user-select: none; position: relative; }
    #sheetWrap .sheet td.cell.sel::after { content: ''; position: absolute; inset: 0; background: rgba(26, 115, 201, 0.22); box-shadow: inset 0 0 0 2px #1a73c9; pointer-events: none; z-index: 2; }
    .sel-sum { position: fixed; top: 74px; right: 20px; z-index: 40; display: none; align-items: baseline; gap: 0.55rem; background: var(--navy-dark); color: #fff; border-radius: 10px; padding: 0.6rem 0.95rem; box-shadow: 0 10px 28px rgba(0,0,0,0.28); font-variant-numeric: tabular-nums; }
    .sel-sum.show { display: flex; }
    .sel-sum .lbl { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: #c8c0b0; }
    .sel-sum b { font-size: 1.25rem; color: #dbb97a; }
    .sel-sum b.neg { color: #ff8a80; }
    .sel-sum .meta { font-size: 0.72rem; color: #c8c0b0; }

    /* ── right-click menu ── */
    .ctx-menu { position: fixed; z-index: 60; min-width: 230px; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.22); padding: 0.3rem; }
    .ctx-menu button { display: flex; justify-content: space-between; gap: 1rem; width: 100%; background: none; border: 0; padding: 0.5rem 0.7rem; border-radius: 5px; cursor: pointer; font-size: 0.85rem; text-align: left; }
    .ctx-menu button span { color: var(--muted); font-variant-numeric: tabular-nums; }
    .ctx-menu button:hover:not(:disabled) { background: var(--page); }
    .ctx-menu button:disabled { opacity: 0.45; cursor: default; }
    .ctx-menu button.danger { color: var(--neg); }
    .sheet td.cell .lk { position: absolute; right: 3px; bottom: 1px; font-size: 0.6rem; font-weight: 700; line-height: 1.1; color: #fff; background: #3b82c4; border-radius: 3px; padding: 0 3px; z-index: 3; white-space: nowrap; pointer-events: auto; cursor: default; }
    /* Difference row: amount on top, link tag(s) underneath, both centered */
    .sheet tr.diff-row td.cell { height: 54px; vertical-align: middle; text-align: center; }
    .sheet tr.diff-row td.cell .calc { text-align: center; padding-left: 0.3rem; padding-right: 0.3rem; }
    .sheet tr.diff-row td.cell .lk-line { line-height: 1; }
    .sheet tr.diff-row td.cell .lk { position: static; display: inline-block; margin: 3px 2px 0; max-width: calc(100% - 8px); overflow: hidden; text-overflow: ellipsis; vertical-align: top; font-size: 0.64rem; padding: 1px 5px; }
    .sheet td.cell .lk.lk-cov { background: #2e7d32; }
    .sheet td.cell .lk.lk-adj { background: #d93025; }
    .cover-pop { position: fixed; z-index: 65; width: 300px; background: var(--navy-dark); color: #fff; border-radius: 10px; padding: 0.7rem 0.75rem; box-shadow: 0 12px 32px rgba(0,0,0,0.35); font-size: 0.8rem; border: 1px solid rgba(201,160,90,0.5); }
    .cover-pop .cp-title { margin-bottom: 0.5rem; line-height: 1.35; }
    .cover-pop .cp-title b { color: #dbb97a; }
    .cover-pop .cp-dates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.3rem; }
    .cover-pop button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.35); border-radius: 6px; padding: 0.35rem 0.2rem; font-size: 0.78rem; cursor: pointer; }
    .cover-pop .cp-dates button:hover { background: #3b82c4; border-color: #3b82c4; }
    .cover-pop .cp-dates button.on { background: #3b82c4; border-color: #3b82c4; font-weight: 700; }
    .cover-pop .cp-acts { display: flex; justify-content: flex-end; gap: 0.35rem; margin-top: 0.55rem; }
    .cover-pop .cp-acts button { padding: 0.25rem 0.7rem; font-size: 0.74rem; }
    .link-bar { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; max-width: calc(100vw - 32px); background: #1f4f7a; color: #fff; border-radius: 10px; padding: 0.55rem 0.8rem 0.55rem 1rem; box-shadow: 0 10px 28px rgba(0,0,0,0.3); font-size: 0.85rem; }
    .link-bar .lb-picked { font-weight: 700; background: rgba(255,255,255,0.15); border-radius: 5px; padding: 0.15rem 0.5rem; }
    .link-bar button { border: 1px solid rgba(255,255,255,0.5); background: transparent; color: #fff; border-radius: 6px; padding: 0.3rem 0.8rem; cursor: pointer; font-size: 0.8rem; }
    .link-bar .lb-done { background: #fff; color: #1f4f7a; font-weight: 700; border-color: #fff; }
    .link-bar button:disabled { opacity: 0.45; cursor: default; }
    html.link-picking #sheetWrap td.cell, html.link-picking #sheetWrap tr.dates th { cursor: crosshair; }
    html.link-picking #sheetWrap td.cell input { pointer-events: none; }
    #sheetWrap .sheet td.cell.lk-col, #sheetWrap .sheet tr.dates th.lk-col { background-image: linear-gradient(rgba(59, 130, 196, 0.25), rgba(59, 130, 196, 0.25)) !important; }
    #sheetWrap .sheet tr.dates th.lk-col { box-shadow: inset 0 -3px 0 #3b82c4; }
    #sheetWrap .sheet td.cell.lk-src { box-shadow: inset 0 0 0 2px #e0a030 !important; }
    .sheet td.cell.lk-partner { box-shadow: inset 0 0 0 2px #3b82c4 !important; }
    .ctx-menu .sep { height: 1px; background: var(--line); margin: 0.25rem 0.3rem; }

    /* ── drag to move amounts ── */
    .sheet td.cell { position: relative; }
    .grip { position: absolute; left: 3px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; line-height: 1; color: #a8a090; cursor: grab; opacity: 0; padding: 4px 2px; border-radius: 3px; z-index: 2; user-select: none; }
    .sheet td.cell:hover .grip { opacity: 1; }
    .grip:hover { background: var(--page); color: var(--gold-ink); }
    tr.drag-row td.cell { outline: 1px dashed rgba(201,160,90,0.45); outline-offset: -3px; }
    td.cell.drop-target { background: #fdf0d2 !important; outline: 2px solid var(--gold) !important; outline-offset: -2px; }
    td.cell.drag-src { opacity: 0.45; }
    @media (hover: none) { .grip { display: none; } }

    /* ── 6-month overview ── */
    .overview { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem 0.9rem 0.5rem; margin-bottom: 1rem; }
    .ov-title { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.4rem; }
    .ov-scroll { overflow-x: auto; }
    .mon-btn { background: none; border: 0; cursor: pointer; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; padding: 0.15rem 0.4rem; border-radius: 4px; }
    .mon-btn:hover { background: var(--now); text-decoration: underline; text-decoration-color: var(--gold); }
    .mon-expand { margin-left: 0.6rem; background: var(--navy); color: #fff; border: 0; border-radius: 4px; padding: 0.2rem 0.6rem; font-size: 0.68rem; letter-spacing: 0.06em; line-height: 1.3; cursor: pointer; vertical-align: middle; }
    .mon-expand:hover { background: var(--gold); }
    .ov-toggle { display: flex; align-items: center; gap: 0.5rem; background: none; border: 0; cursor: pointer; padding: 0; width: 100%; text-align: left; }
    .ov-toggle:hover { color: var(--gold-ink); }
    .ov-arrow { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); font-size: 0.6rem; color: var(--gold-ink); transition: transform 0.2s; }
    .ov-toggle:hover .ov-arrow { border-color: var(--gold); }
    .overview.collapsed { padding-bottom: 0.75rem; }
    .stats-wrap { margin-bottom: 1rem; }
    .stats-wrap .stats { margin-bottom: 0; }
    .stats-toggle { margin: 0 0 0.45rem 0.15rem; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    .stats-wrap.collapsed { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem 0.9rem; }
    .stats-wrap.collapsed .stats-toggle { margin: 0; }
    .stats-wrap.collapsed .stats { display: none; }
    .stats-wrap.collapsed .ov-arrow { transform: rotate(180deg); }
    .overview.collapsed .ov-scroll { display: none; }
    .overview.collapsed .ov-title { margin-bottom: 0; }
    .overview.collapsed .ov-arrow { transform: rotate(180deg); }
    .ov-hint { text-transform: none; letter-spacing: 0; color: var(--muted); font-size: 0.72rem; }
    table.ov { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 640px; }
    table.ov th, table.ov td { padding: 0.45rem 0.6rem; text-align: right; font-size: 0.94rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
    table.ov tbody th { text-align: left; font-weight: 500; color: var(--muted); font-size: 0.9rem; }
    table.ov tr:last-child th, table.ov tr:last-child td { border-bottom: 0; }
    table.ov td { font-weight: 600; }
    table.ov td.neg { color: var(--neg); }
    table.ov .tot { background: #faf8f3; border-left: 2px solid var(--line-strong); }
    table.ov thead th.tot { font-size: 0.72rem; color: var(--gold-ink); text-transform: uppercase; letter-spacing: 0.06em; }
    table.ov tr.ov-save td { background: rgba(255, 243, 191, 0.55); }
    table.ov tr.ov-rem td { background: #ebe3f7; }
    table.ov tr.ov-save td.tot, table.ov tr.ov-rem td.tot { font-weight: 700; }
    table.ov th.cur, table.ov td.cur { box-shadow: inset 2px 0 0 var(--gold), inset -2px 0 0 var(--gold); }
    table.ov thead th.cur { box-shadow: inset 2px 0 0 var(--gold), inset -2px 0 0 var(--gold), inset 0 2px 0 var(--gold); background: var(--now); }
    table.ov tbody tr:last-child td.cur { box-shadow: inset 2px 0 0 var(--gold), inset -2px 0 0 var(--gold), inset 0 -2px 0 var(--gold); }
    table.ov tr.ov-per td { vertical-align: top; padding-top: 0.35rem; padding-bottom: 0.35rem; }
    table.ov tr.ov-per th small { display: block; font-size: 0.72rem; color: var(--muted); font-weight: 400; }
    table.ov .per-grid { display: inline-grid; grid-template-columns: max-content max-content; column-gap: 0.6rem; row-gap: 0.1rem; line-height: 1.55; }
    table.ov .per-grid .dt { text-align: left; color: var(--muted); font-weight: 500; font-size: 0.8rem; align-self: center; }
    table.ov .per-grid .amt { text-align: right; font-size: 0.9rem; }
    table.ov .per-grid .amt.pos { color: #2e7d32; }
    table.ov .per-grid .amt.neg { color: var(--neg); }
    table.ov tr.ov-per td.tot div { color: var(--muted); font-weight: 500; font-size: 0.75rem; }
    .ov-month { background: none; border: 0; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: var(--ink); text-align: right; }
    .ov-month small { display: block; font-weight: 400; font-size: 0.66rem; color: var(--muted); }
    .ov-month .pick-box { display: inline-flex; align-items: center; justify-content: center; width: 0.95rem; height: 0.95rem; margin-right: 0.35rem; border: 1.5px solid var(--line-strong); border-radius: 3px; font-size: 0.7rem; line-height: 1; vertical-align: -0.1rem; color: #fff; }
    table.ov th.pick .pick-box { background: #3b82c4; border-color: #3b82c4; }
    table.ov th.pick, table.ov td.pick { background-image: linear-gradient(rgba(59, 130, 196, 0.16), rgba(59, 130, 196, 0.16)) !important; }
    .ov-picked { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin: -0.1rem 0 0.4rem; padding: 0.35rem 0.6rem; border-radius: 6px; background: rgba(59, 130, 196, 0.1); border: 1px solid rgba(59, 130, 196, 0.35); font-size: 0.85rem; }
    .ov-picked.empty { background: none; border-color: transparent; padding: 0 0 0.1rem; color: var(--muted); font-size: 0.75rem; }
    .ov-picked .lbl { color: var(--muted); }
    .ov-picked .amt { font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
    .ov-picked .amt.pos { color: #2e7d32; } .ov-picked .amt.neg { color: var(--neg); }
    html.dark .ov-picked .amt.pos { color: #7fd18a; }
    .ov-clear { margin-left: auto; background: none; border: 1px solid var(--line-strong); border-radius: 5px; padding: 0.15rem 0.55rem; font-size: 0.75rem; color: var(--ink); cursor: pointer; }
    .ov-clear.next { margin-left: 0; }
    .ov-picked.empty .ov-clear { font-size: 0.72rem; }
    .ov-clear:hover { border-color: var(--gold); color: var(--gold-ink); }
    .ov-month:hover { color: var(--gold-ink); text-decoration: underline; text-decoration-color: var(--gold); }

    /* ── grid ── */
    .sheet-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: calc(100vh - 230px); }
    table.sheet { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
    .sheet th, .sheet td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; height: 38px; white-space: nowrap; }
    .sheet thead th { position: sticky; background: #fbfaf7; z-index: 5; font-weight: 600; font-size: 0.82rem; }
    .sheet thead tr.months th { top: 0; height: 30px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold-ink); border-bottom-color: var(--line); }
    .sheet thead tr.dates th { top: 30px; color: var(--muted); font-weight: 500; }
    .sheet thead th.month { border-right: 2px solid var(--line-strong); }
    .sheet th.col-name, .sheet td.col-name { position: sticky; left: 0; z-index: 4; background: var(--card); width: var(--stick-w); min-width: var(--stick-w); max-width: var(--stick-w); text-align: left; }
    .sheet th.col-due, .sheet td.col-due { position: sticky; left: var(--stick-w); z-index: 4; background: var(--card); width: var(--due-w); min-width: var(--due-w); max-width: var(--due-w); text-align: center; }
    .due-val { font-size: 0.86rem; font-weight: 600; color: var(--gold-ink); overflow: hidden; text-overflow: ellipsis; padding: 0 0.2rem; }
    .due-val.soon { background: var(--gold); color: #fff; border-radius: 999px; padding: 0.15rem 0.45rem; display: inline-block; }
    .sheet th.col-budget, .sheet td.col-budget { position: sticky; left: calc(var(--stick-w) + var(--due-w)); z-index: 4; background: var(--card); width: var(--budget-w); min-width: var(--budget-w); text-align: right; border-right: 2px solid var(--line-strong); }
    .sheet thead th.col-name, .sheet thead th.col-due, .sheet thead th.col-budget { z-index: 7; background: #fbfaf7; }
    .sheet thead th.col-name { padding-left: 0.8rem; }
    .sheet thead th.col-budget { padding-right: 0.6rem; }
    .sheet td.cell { min-width: 108px; }
    .sheet td.cell.month-end, .sheet th.month-end { border-right: 2px solid var(--line-strong); }
    .sheet td.cell.past { background: var(--past); }
    .sheet td.cell.now, .sheet thead th.now { background: var(--now); }
    .sheet thead th.now { color: var(--gold-ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--gold); }

    .name-btn { display: flex; align-items: center; gap: 0.4rem; width: 100%; height: 100%; padding: 0 0.6rem 0 0.8rem; background: none; border: 0; cursor: pointer; text-align: left; overflow: hidden; }
    .name-btn:hover .nm { text-decoration: underline; text-decoration-color: var(--gold); }
    .name-btn .txt { display: flex; flex-direction: column; overflow: hidden; min-width: 0; flex: 1; }
    .name-btn .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; font-size: 0.96rem; }
    .name-btn .nt { font-size: 0.76rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
    .chip { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.04em; padding: 0.1rem 0.35rem; border-radius: 999px; background: #eef0f2; color: var(--muted); flex: none; }
    .chip.rep { background: #e7f0e4; color: #3d6b35; }
    .chip.shr { background: var(--row-shared); color: var(--gold-ink); }
    .name-btn.sub { padding-left: 2.1rem; }
    .name-btn.sub::before { content: '↳'; color: var(--line-strong); margin-left: -1.1rem; width: 0.8rem; flex: none; }
    .name-btn.sub .nm { font-weight: 400; color: #3b434c; }
    .budget-val { padding-right: 0.6rem; font-size: 0.92rem; color: var(--muted); font-variant-numeric: tabular-nums; }

    .cell input { width: 100%; height: 37px; border: 0; background: transparent; text-align: right; padding: 0 0.55rem; font-size: 0.94rem; font-variant-numeric: tabular-nums; outline: none; }
    .cell input::placeholder { color: var(--ink); font-style: normal; opacity: 1; }
    .cell input:focus { background: #fff; box-shadow: inset 0 0 0 2px var(--gold); }
    .cell input.zero { color: #b5bac1; }
    .cell input.neg { color: var(--neg); }
    .calc { text-align: right; padding: 0 0.55rem; font-weight: 600; font-size: 0.94rem; font-variant-numeric: tabular-nums; }
    .calc.neg { color: var(--neg); }

    tr.section-head td { background: var(--navy); color: #fff; height: 38px; }
    tr.section-head td.col-name, tr.section-head td.col-due, tr.section-head td.col-budget { background: var(--navy); }
    tr.section-head .sec-title { display: flex; align-items: center; gap: 0.6rem; padding-left: 0.8rem; }
    tr.section-head .sec-title button.sec-name { background: none; border: 0; color: #fff; font-weight: 600; letter-spacing: 0.04em; cursor: pointer; font-size: 0.96rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    tr.section-head .sec-title { padding-right: 0.5rem; }
    tr.section-head .add-line { flex: none; }
    .item-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding-right: 0.6rem; }
    .all-toggle { text-transform: none; letter-spacing: 0; font-size: 0.72rem; font-weight: 600; color: var(--gold-ink); background: transparent; border: 1px solid var(--line-strong); border-radius: 999px; padding: 0.2rem 0.6rem; cursor: pointer; white-space: nowrap; }
    .all-toggle:hover { border-color: var(--gold); background: var(--now); }
    tr.section-head .sec-toggle { flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35); background: transparent; color: #fff; font-size: 0.55rem; cursor: pointer; transition: transform 0.15s; padding: 0; }
    tr.section-head .sec-toggle:hover { border-color: var(--gold); color: var(--gold); }
    tr.section-head .sec-toggle.closed { transform: rotate(180deg); }
    tr.section-head .sec-hidden { flex: none; font-size: 0.66rem; color: #c8c0b0; font-weight: 400; letter-spacing: 0; }
    tr.add-row td, tr.add-row td.col-name, tr.add-row td.col-due, tr.add-row td.col-budget { background: var(--card); height: 34px; }
    tr.add-row .add-exp { display: flex; align-items: center; gap: 0.45rem; width: 100%; height: 100%; padding: 0 0.8rem; background: none; border: 0; cursor: pointer; color: var(--gold-ink); font-weight: 600; font-size: 0.9rem; text-align: left; }
    tr.add-row .add-exp .plus { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--gold); color: var(--gold-ink); font-size: 0.95rem; line-height: 1; }
    tr.add-row .add-exp:hover { background: var(--now); }
    tr.add-row .add-exp:hover .plus { background: var(--gold); color: #fff; }
    tr.section-head .sec-title button.sec-name:hover { color: var(--gold); }
    tr.section-head .add-line { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 4px; font-size: 0.68rem; padding: 0.15rem 0.45rem; cursor: pointer; }
    tr.section-head .add-line:hover { border-color: var(--gold); color: var(--gold); }
    tr.section-head .tag { font-size: 0.62rem; color: var(--gold); letter-spacing: 0.06em; }

    tr.section-head td.cell, tr.section-head td.cell.past, tr.section-head td.cell.now { background: var(--navy); }
    tr.section-head td.cell.now { background: #1c2f63; }
    tr.section-head .cell input { color: #fff; font-weight: 600; }
    tr.section-head .cell input::placeholder { color: #fff; font-weight: 600; }
    tr.section-head .cell input:focus { background: #fff; color: var(--ink); }
    tr.total-row td, tr.total-row td.col-name, tr.total-row td.col-due, tr.total-row td.col-budget { background: var(--row-total); font-weight: 600; }
    tr.total-row td.col-name { padding-left: 0.8rem; font-size: 0.92rem; }
    tr.total-row td.col-due, tr.total-row td.col-budget { padding-right: 0.6rem; font-size: 0.92rem; }
    tr.sum-pay td, tr.sum-pay td.col-name, tr.sum-pay td.col-due, tr.sum-pay td.col-budget { background: var(--row-pay); }
    tr.sum-save td, tr.sum-save td.col-name, tr.sum-save td.col-due, tr.sum-save td.col-budget { background: var(--row-save); }
    tr.sum-shared td, tr.sum-shared td.col-name, tr.sum-shared td.col-due, tr.sum-shared td.col-budget { background: var(--row-shared); }
    tr.sum-rem td, tr.sum-rem td.col-name, tr.sum-rem td.col-due, tr.sum-rem td.col-budget { background: var(--row-rem); }
    tr.sum-row td.col-name .lbl { padding-left: 0.8rem; font-weight: 600; font-size: 0.96rem; display: block; }
    tr.sum-row td.col-name .lbl small { display: block; font-weight: 400; font-size: 0.74rem; color: var(--muted); }
    tr.sum-pay td.cell.past, tr.sum-pay td.cell.now { background: var(--row-pay); }
    tr.sum-save td.cell.past, tr.sum-save td.cell.now { background: var(--row-save); }
    tr.sum-shared td.cell.past, tr.sum-shared td.cell.now { background: var(--row-shared); }
    tr.sum-rem td.cell.past, tr.sum-rem td.cell.now { background: var(--row-rem); }
    tr.sum-row td.col-name .lbl small { overflow: hidden; text-overflow: ellipsis; }
    tr.spacer-row td { height: 14px; background: var(--page); border-right: 0; }
    tr.spacer-row td.col-name, tr.spacer-row td.col-due, tr.spacer-row td.col-budget { background: var(--page); }

    .add-section { margin-top: 1rem; }
    .hint { color: var(--muted); font-size: 0.78rem; margin-top: 0.8rem; line-height: 1.6; }

    /* ── empty state ── */
    .welcome { max-width: 560px; margin: 4rem auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 2rem; text-align: center; }
    .welcome h2 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; margin-bottom: 0.6rem; }
    .welcome p { color: var(--muted); line-height: 1.6; margin-bottom: 1.4rem; }
    .welcome .row { display: flex; gap: 0.7rem; justify-content: center; flex-wrap: wrap; }

    /* ── dialog ── */
    dialog { margin: auto; max-height: calc(100vh - 32px); overflow: auto; border: 0; border-radius: 12px; padding: 0; width: min(440px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,0.3); color: var(--ink); }
    dialog::backdrop { background: rgba(9,21,53,0.45); }
    dialog form { padding: 1.4rem; display: grid; gap: 0.9rem; }
    dialog h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; }
    dialog label { display: grid; gap: 0.3rem; font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    dialog input[type=text], dialog select { border: 1px solid var(--line-strong); border-radius: 6px; padding: 0.55rem 0.65rem; font-size: 0.9rem; text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 400; }
    dialog input[type=text]:focus, dialog select:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
    dialog .check { display: flex; align-items: center; gap: 0.5rem; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink); font-size: 0.88rem; }
    dialog .help { font-size: 0.72rem; color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 400; line-height: 1.5; }
    dialog .actions { display: flex; gap: 0.5rem; justify-content: flex-end; flex-wrap: wrap; margin-top: 0.3rem; }
    dialog .actions .left { margin-right: auto; display: flex; gap: 0.4rem; }

    .apply-choices { display: grid; gap: 0.5rem; }
    .apply-choices .btn { padding: 0.75rem 0.9rem; text-align: left; font-size: 0.88rem; }
    .apply-choices .btn small { display: block; font-size: 0.72rem; opacity: 0.75; margin-top: 0.15rem; }

    @media (max-width: 700px) {
      :root { --stick-w: 150px; --due-w: 48px; --budget-w: 74px; }
      main { padding: 0.75rem 16px; }
      .topbar { padding: 0.6rem 16px; gap: 0.6rem; }
      .topbar img { height: 30px; }
      .topbar h1 { font-size: 1.3rem; }
      .save-state span { display: none; }
      .undo-btn span:not(#themeIcon) { display: none; }
      .undo-btn { padding: 0.35rem 0.5rem; }
      .topbar { gap: 0.45rem; }
      .range-label { flex-basis: 100%; order: -1; text-align: left; min-width: 0; white-space: nowrap; }
      .controls select { flex: 1; }
      .controls .spacer { display: none; }
      .name-btn .chip { display: none; }
      .sheet-wrap { max-height: none; }
    }

    /* ═════════ MATRIX BACKGROUND ═════════ */
    #matrixBg { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.9; display: none; will-change: transform; transform: translateZ(0); }
    .sheet-wrap { will-change: scroll-position; }
    html.matrix #matrixBg { display: block; }

  <script>
  (() => {
    'use strict';
    const API = '/excel/api/budget';
    const LS_KEY = 'mirmont-budget-v1';
    const LS_VIEW = 'mirmont-budget-view';
    const DAY = 86400000;
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    let data = null;      // the budget document
    let rev = 0;          // server revision
    let mode = 'server';  // 'server' | 'local'
    let saveTimer = null, saving = false, pendingSave = false;

    const view = { start: null, months: 3, extra: 0 };
    try { const v = JSON.parse(localStorage.getItem(LS_VIEW) || '{}'); if ([3,6,12].includes(v.months)) view.months = v.months; } catch {}
    view.ovHidden = false; // overview always shows when the page opens
    const saveView = () => { try { localStorage.setItem(LS_VIEW, JSON.stringify({ months: view.months })); } catch {} };

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = (n, blankZero) => {
      if (n == null || isNaN(n)) return '';
      if (blankZero && n === 0) return '';
      const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 });
      return (n < 0 ? '−$' : '$') + s;
    };
    const plain = (n) => n == null ? '' : String(Math.round(n * 100) / 100);
    // accounting look for the amount boxes: $4,739.64
    const acct = (n) => n == null ? '' : (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const parseAmt = (s) => {
      s = String(s ?? '').trim().replace(/[$,\s]/g, '').replace(/^\((.*)\)$/, '-$1').replace('−', '-');
      if (s === '') return null;
      const n = Number(s);
      return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
    };
    const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    // ── dates (all UTC, ISO yyyy-mm-dd) ──
    const toISO = (t) => new Date(t).toISOString().slice(0, 10);
    const fromISO = (s) => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
    const monthStart = (y, m) => Date.UTC(y, m, 1);
    const todayUTC = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); };

    function periodsBetween(t0, t1) { // pay dates in [t0, t1)
      const step = (data.periodDays || 14) * DAY, a = fromISO(data.anchor);
      let k = Math.ceil((t0 - a) / step), out = [];
      for (let t = a + k * step; t < t1; t = a + (++k) * step) out.push(toISO(t));
      return out;
    }
    function periodsInMonth(iso) {
      const y = +iso.slice(0, 4), m = +iso.slice(5, 7) - 1;
      return periodsBetween(monthStart(y, m), monthStart(y, m + 1));
    }
    function currentPeriod() {
      const step = (data.periodDays || 14) * DAY, a = fromISO(data.anchor);
      return toISO(a + Math.floor((todayUTC() - a) / step) * step);
    }

    // ── values & repeat logic ──
    const sortedCache = new Map();
    function explicitDates(id) {
      if (!sortedCache.has(id)) sortedCache.set(id, Object.keys(data.values[id] || {}).sort());
      return sortedCache.get(id);
    }
    function lastBefore(id, iso) { // latest explicit date strictly before iso
      const ds = explicitDates(id);
      let lo = 0, hi = ds.length - 1, ans = null;
      while (lo <= hi) { const mid = (lo + hi) >> 1; if (ds[mid] < iso) { ans = ds[mid]; lo = mid + 1; } else hi = mid - 1; }
      return ans;
    }
    function itemInfo(id) {
      if (data.special[id]) return data.special[id];
      for (const s of data.sections) for (const it of s.items) if (it.id === id) return it;
      return null;
    }
    // returns {v, carried}
    const roVals = {}; // read-only calculated boxes (Difference row) — selectable for the sum, never editable
    function cellValue(id, iso) {
      if (id[0] === '=') { const v = roVals[id + '|' + iso]; return { v: v == null ? null : v, carried: false }; }
      const vals = data.values[id] || {};
      if (iso in vals) return { v: vals[iso], carried: false };
      const it = itemInfo(id);
      const rep = it && it.repeat;
      if (!rep || rep === 'off') return { v: null, carried: false };
      if (rep === 'every') {
        const src = lastBefore(id, iso);
        return src ? { v: vals[src], carried: true } : { v: null, carried: false };
      }
      // monthly / quarterly: one carried amount per month (every 3rd month for quarterly),
      // in the same paycheck slot as the source
      const inMonth = periodsInMonth(iso);
      if (inMonth.some(d => d in vals)) return { v: null, carried: false };
      const src = lastBefore(id, inMonth[0]);
      if (!src) return { v: null, carried: false };
      const every = { quarterly: 3, semiannual: 6, yearly: 12 }[rep];
      if (every) {
        const mi = (d) => (+d.slice(0, 4)) * 12 + (+d.slice(5, 7));
        if ((mi(iso) - mi(src)) % every !== 0) return { v: null, carried: false };
      }
      const srcSlot = periodsInMonth(src).indexOf(src);
      const slot = Math.min(srcSlot, inMonth.length - 1);
      return inMonth.indexOf(iso) === slot ? { v: vals[src], carried: true } : { v: null, carried: false };
    }
    const num = (id, iso) => cellValue(id, iso).v || 0;

    // a negative (short) Adjustments box "covered by" another check moves that amount onto the covering check
    function coverAmt(id, iso) {
      const cb = data.coveredBy; if (!cb) return 0;
      let t = 0;
      for (const k in cb) {
        if (!k.startsWith(id + '|')) continue;
        const by = lkList(cb[k]); if (!by.includes(iso)) continue;
        const v = cellValue(id, k.slice(id.length + 1)).v;
        if (v != null && v < 0) t += -v / by.length;
      }
      return Math.round(t * 100) / 100;
    }
    function computePeriod(iso) {
      const r = { sections: {} , fromPay: 0, shared: 0 };
      for (const s of data.sections) {
        let t = 0;
        for (const it of s.items) {
          const v = num(it.id, iso) + coverAmt(it.id, iso); t += v;
          if (it.shared) r.shared += v;
        }
        r.sections[s.id] = t;
        if (s.fromPaycheck) r.fromPay += t;
      }
      r.pay = num('paycheck', iso);
      r.savings = r.pay - r.fromPay;
      r.sharedTotal = r.shared + r.savings;
      r.withdraw = num('withdraw', iso);
      r.remainder = r.savings - r.withdraw;
      return r;
    }

    function setValue(id, iso, n, keepLinks) {
      data.values[id] = data.values[id] || {};
      if (n === null) delete data.values[id][iso]; else data.values[id][iso] = n;
      if (!keepLinks && (n === null || n === 0)) dropLinks(id, iso);
      sortedCache.delete(id);
    }

    // ── rendering ──
    function visibleMonths() {
      const out = [];
      const st = view.focus || view.start, count = view.focus ? 1 : view.months + view.extra;
      for (let i = 0; i < count; i++) {
        const t = monthStart(st.y, st.m + i), d = new Date(t);
        out.push({ y: d.getUTCFullYear(), m: d.getUTCMonth(), periods: periodsBetween(t, monthStart(st.y, st.m + i + 1)) });
      }
      return out;
    }

    const ordinal = (n) => n + ((n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'));
    function dueHtml(due) {
      if (due == null || String(due).trim() === '') return '';
      const t = String(due).trim();
      if (/^\d{1,2}$/.test(t)) {
        const d = +t, today = new Date().getDate();
        const ahead = (d - today + 31) % 31; // due within the next 5 days
        return `<span class="due-val${ahead <= 5 ? ' soon' : ''}" title="Due on the ${ordinal(d)} of each month">${ordinal(d)}</span>`;
      }
      return `<span class="due-val" title="${esc(t)}">${esc(t)}</span>`;
    }

    function render() {
      sortedCache.clear();
      const app = $('app');
      if (!data) { renderWelcome(); return; }
      const months = visibleMonths();
      const cols = [];
      months.forEach(mo => mo.periods.forEach((p, i) => cols.push({ iso: p, monthEnd: i === mo.periods.length - 1 })));
      const nowP = currentPeriod();
      const calc = Object.fromEntries(cols.map(c => [c.iso, computePeriod(c.iso)]));
      const cls = (c) => ['cell', 'c' + c.iso, c.monthEnd ? 'month-end' : '', c.iso < nowP ? 'past' : '', c.iso === nowP ? 'now' : ''].join(' ');

      const first = months[0], last = months[months.length - 1];
      const FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const rangeLbl = months.length === 1 ? `${FULL[first.m]} ${first.y}` : first.y === last.y
        ? `${MONTHS[first.m]} – ${MONTHS[last.m]} ${last.y}`
        : `${MONTHS[first.m]} ${first.y} – ${MONTHS[last.m]} ${last.y}`;

      let h = '';
      // controls
      h += `<div class="controls">
        <button class="btn icon" data-act="prev" title="Earlier month">◀</button>
        <div class="range-label">${rangeLbl}</div>
        <button class="btn icon" data-act="next" title="Later month">▶</button>
        <button class="btn" data-act="today">This month</button>
        ${view.focus ? '<button class="btn primary" data-act="unfocus">View all months ›</button>' : ''}
        <span class="spacer"></span>
        <select data-act="months" aria-label="Months shown">
          ${[3,6,12].map(n => `<option value="${n}" ${n === view.months ? 'selected' : ''}>Show ${n} months</option>`).join('')}
        </select>
      </div>`;

      // stats for current month
      const nowMonth = periodsInMonth(nowP);
      const agg = nowMonth.reduce((a, p) => { const c = computePeriod(p); a.pay += c.pay; a.from += c.fromPay; a.save += c.savings; a.rem += c.remainder; return a; }, { pay: 0, from: 0, save: 0, rem: 0 });
      const nd = new Date(fromISO(nowP));
      const stat = (k, v) => `<div class="stat"><div class="k">${k}</div><div class="v ${v < 0 ? 'neg' : ''}">${money(v) || '$0'}</div></div>`;
      const FULLM = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      h += `<div class="stats-wrap${view.statsHidden ? ' collapsed' : ''}">
        <button type="button" class="ov-title ov-toggle stats-toggle" data-act="statstoggle" aria-expanded="${!view.statsHidden}" title="${view.statsHidden ? 'Show' : 'Hide'} this month's summary"><span class="ov-arrow">▲</span>${FULLM[nd.getUTCMonth()]} summary${view.statsHidden ? `<span class="ov-hint">— ${nowMonth.map(p => { const c = computePeriod(p), v = Math.round((c.pay - c.fromPay) * 100) / 100; return `${fmtDate(p)} ${v < 0 ? '−' : '+'}${money(Math.abs(v)) || '$0'}`; }).join(' · ')} · click to show</span>` : ''}</button>
        <div class="stats">
        ${nowMonth.map(p => { const c = computePeriod(p), v = Math.round((c.pay - c.fromPay) * 100) / 100;
          return `<div class="stat stat-per${p === nowP ? ' cur' : ''}" title="Difference for this paycheck — send to savings"><div class="k">${fmtDate(p)}</div><div class="v ${v < 0 ? 'neg' : 'pos'}">${v < 0 ? '−' : '+'}${money(Math.abs(v)) || '$0'}</div></div>`; }).join('')}
      </div></div>`;

      // next 6 months overview
      const ahead = [];
      for (let i = 0; i <= 6; i++) {
        const t = monthStart(nd.getUTCFullYear(), nd.getUTCMonth() + i), md = new Date(t);
        const ps = periodsBetween(t, monthStart(md.getUTCFullYear(), md.getUTCMonth() + 1));
        const a = ps.reduce((o, p) => { const c = computePeriod(p); o.pay += c.pay; o.from += c.fromPay; o.save += c.savings; o.rem += c.remainder; return o; }, { pay: 0, from: 0, save: 0, rem: 0 });
        ahead.push({ y: md.getUTCFullYear(), m: md.getUTCMonth(), n: ps.length, ...a,
          per: ps.map(p => { const c = computePeriod(p); return { d: p, v: Math.round((c.pay - c.fromPay) * 100) / 100 }; }) });
      }
      const tot = ahead.reduce((o, a) => { ['pay', 'from', 'save', 'rem'].forEach(k => o[k] += a[k]); return o; }, { pay: 0, from: 0, save: 0, rem: 0 });
      const pk = (a) => a && ovPicked.has(`${a.y}-${a.m}`) ? 'pick' : '';
      const cell = (v, extra = '', i = -1) => `<td class="${v < 0 ? 'neg' : ''} ${extra} ${i === 0 ? 'cur' : ''} ${pk(ahead[i])}">${money(Math.round(v * 100) / 100) || '$0'}</td>`;
      const orow = (label, k, cls = '') => `<tr class="${cls}"><th>${label}</th>${ahead.map((a, i) => cell(a[k], '', i)).join('')}${cell(tot[k], 'tot')}</tr>`;
      h += `<div class="overview${view.ovHidden ? ' collapsed' : ''}"><button type="button" class="ov-title ov-toggle" data-act="ovtoggle" aria-expanded="${!view.ovHidden}" title="${view.ovHidden ? 'Show' : 'Hide'} the overview"><span class="ov-arrow">▲</span>This month + next 6 months${view.ovHidden ? '<span class="ov-hint">— click to show</span>' : ''}</button>${(() => {
          if (view.ovHidden) return '';
          const sel = ahead.filter(a => ovPicked.has(`${a.y}-${a.m}`));
          const allKeys = ahead.map(a => `${a.y}-${a.m}`).join(',');
          const allBtn = sel.length < ahead.length ? `<button type="button" class="ov-clear ov-all" data-act="ovall" data-keys="${allKeys}">Select all</button>` : '';
          if (!sel.length) return `<div class="ov-picked empty">Tip: click month names to add up their Remainder${allBtn}</div>`;
          const sum = Math.round(sel.reduce((n, a) => n + a.rem, 0) * 100) / 100;
          return `<div class="ov-picked"><span class="lbl">Remainder total · ${sel.map(a => MONTHS[a.m]).join(' + ')}</span><span class="amt ${sum < 0 ? 'neg' : 'pos'}">${sum < 0 ? '−' : ''}${money(Math.abs(sum)) || '$0'}</span>${allBtn}<button type="button" class="ov-clear${allBtn ? ' next' : ''}" data-act="ovclear">Clear</button></div>`;
        })()}<div class="ov-scroll"><table class="ov">
        <thead><tr><th></th>${ahead.map((a, i) => `<th class="${i === 0 ? 'cur' : ''} ${pk(a)}"><button class="ov-month" data-act="ovpick" data-k="${a.y}-${a.m}" aria-pressed="${!!pk(a)}" title="${pk(a) ? 'Remove' : 'Add'} ${MONTHS[a.m]} ${a.y} ${pk(a) ? 'from' : 'to'} the Remainder total"><span class="pick-box" aria-hidden="true">${pk(a) ? '✓' : ''}</span>${MONTHS[a.m]} ${a.y !== nd.getUTCFullYear() ? "'" + String(a.y).slice(2) : ''}<small>${a.n} paychecks</small></button></th>`).join('')}<th class="tot">7-mo total</th></tr></thead>
        <tbody>
          ${orow('Paychecks', 'pay')}
          ${orow('Paid from paycheck', 'from')}
          ${orow('Send to *5011 Everyday Checking', 'save', 'ov-save')}
          <tr class="ov-per"><th>Difference by paycheck<small>send to savings from each check</small></th>${ahead.map((a, i) => `<td class="${i === 0 ? 'cur' : ''} ${pk(a)}"><div class="per-grid">${a.per.map(x => `<span class="dt">${fmtDate(x.d)}</span><span class="amt ${x.v < 0 ? 'neg' : 'pos'}">${x.v < 0 ? '−' : '+'}${money(Math.abs(x.v)) || '$0'}</span>`).join('')}</div></td>`).join('')}<td class="tot"><div class="${tot.from > tot.pay ? 'neg' : 'pos'}">${ahead.reduce((n, a) => n + a.n, 0)} checks</div></td></tr>
          ${orow('Remainder', 'rem', 'ov-rem')}
        </tbody></table></div></div>`;

      // table
      h += `<div class="sheet-wrap" id="sheetWrap"><table class="sheet" style="min-width: calc(var(--stick-w) + var(--due-w) + var(--budget-w) + ${cols.length * 108}px)"><colgroup><col style="width: var(--stick-w)"><col style="width: var(--due-w)"><col style="width: var(--budget-w)">${cols.map(() => '<col>').join('')}</colgroup><thead><tr class="months">
        <th class="col-name" rowspan="2"><div class="item-head">Item${(() => { const allClosed = data.sections.length && data.sections.every(x => collapsedSecs.has(x.id)); return `<button type="button" class="all-toggle" data-act="secall" title="${allClosed ? 'Show every section' : 'Fold every section to its total'}">${allClosed ? '▼ Show all' : '▲ Collapse all'}</button>`; })()}</div></th><th class="col-due" rowspan="2">Due</th><th class="col-budget" rowspan="2">Budget/mo</th>`;
      months.forEach(mo => { if (mo.periods.length) h += `<th class="month" colspan="${mo.periods.length}"><button type="button" class="mon-btn" data-focus="${mo.y}-${mo.m}" title="${view.focus ? 'Showing only this month' : 'Show only ' + MONTHS[mo.m] + ' ' + mo.y}">${MONTHS[mo.m]} ${mo.y}</button>${view.focus ? '<button type="button" class="mon-expand" data-act="unfocus" title="Show the other months again">View all months ›</button>' : ''}</th>`; });
      h += `</tr><tr class="dates">`;
      cols.forEach(c => { const d = new Date(fromISO(c.iso)); h += `<th class="c${c.iso} ${calc[c.iso].remainder < 0 ? 'hd-neg' : 'hd-pos'} ${c.monthEnd ? 'month-end' : ''} ${c.iso === nowP ? 'now' : ''}">${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}${c.iso === nowP ? ' · now' : ''}</th>`; });
      h += `</tr></thead><tbody>`;

      const inputCell = (id, c) => {
        const { v, carried } = cellValue(id, c.iso);
        const val = carried || v == null ? '' : acct(v);
        const ph = carried && v != null ? acct(v) : '';
        const raw = carried || v == null ? '' : plain(v);
        const k = v === 0 && !carried ? 'zero' : (v < 0 ? 'neg' : '');
        let bal = '', tip = '';
        if (id === 'paycheck') {
          const rem = calc[c.iso].remainder;
          bal = rem < 0 ? ' bal-neg' : ' bal-pos';
          tip = ` title="Remainder this paycheck: ${money(rem) || '$0'}"`;
        }
        const grip = v != null && v !== 0 && id !== 'paycheck' ? `<span class="grip" draggable="true" data-gid="${id}" data-gd="${c.iso}" title="Drag to move this amount to another pay period (hold Option to copy)">⠿</span>` : '';
        const sg = suggestion(id, c.iso);
        const nowP0 = currentPeriod();
        const needs = sg && sg.eligible && sg.short > 0.005 && sg.due >= nowP0;
        // the check that pays next month's bill (due before next month's first paycheck)
        const prevMonthCk = sg && sg.due >= nowP0 && sg.checks.includes(c.iso) && c.iso.slice(0, 7) !== sg.due.slice(0, 7);
        if (prevMonthCk && sg.short <= 0.005 && (v || 0) > 0) {
          // covered: no warning, just a quiet note on hover
          tip = ` title="Pays ${esc((itemInfo(id) || {}).name)} ${sg.label} (next month) ✓ covered"`;
        } else if (prevMonthCk && sg.short > 0.005 && ((v || 0) > 0 || c.iso === sg.payer)) {
          bal += ' due-late';
          tip = ` title="Pays ${esc((itemInfo(id) || {}).name)} ${sg.label} (next month), so make this payment from the ${fmtDate(c.iso)} check. Planned ${money(sg.have) || '$0'} of ${money(sg.A)}."`;
        }
        if (needs) { bal += ' due-short'; tip = ` title="${esc((itemInfo(id) || {}).name)} ${sg.label}: needs ${money(sg.A)}, planned ${money(sg.have) || '$0'} — short ${money(sg.short)}${bal.includes('due-late') ? '. This bill is due next month, before its first paycheck, so pay it from this check.' : ''}"`; }
        const hint = needs ? `<button type="button" class="sugg" tabindex="-1" data-sid="${id}" data-sd="${c.iso}" title="Suggested ${money(sg.amt)} so ${money(sg.A)} ${sg.label} is covered. Double-click to use it.">?</button>` : '';
        const lkT = v != null && v !== 0 ? lkList(data.links && data.links[id + '|' + c.iso]) : [];
        const inc = v != null && v < 0 ? lkList(data.coveredBy && data.coveredBy[id + '|' + c.iso]) : [];
        const adjCls = /adjust/i.test((itemInfo(id) || {}).name || '') ? ' lk-adj' : '';
        const cov = id !== 'paycheck' ? coverAmt(id, c.iso) : 0;
        if (cov && !tip) tip = ` title="This check also covers ${money(cov)} of shortages (counted in this column's Total)"`;
        const lk = !lkT.length && inc.length ? `<span class="lk lk-to${adjCls}" data-lk="${inc.join(',')}" title="Covered by the ${inc.map(fmtDate).join(' + ')} check${inc.length > 1 ? 's' : ''}">← ${inc.map(fmtDate).join(', ')}</span>` : lkT.length ? `<span class="lk lk-from${adjCls}" data-lk="${lkT.join(',')}" title="${esc((itemInfo(id) || {}).name)}: ${money(v) || '$0'} from the ${fmtDate(c.iso)} check covers the ${lkT.map(fmtDate).join(' + ')} check${lkT.length > 1 ? 's' : ''}">→ ${lkT.map(fmtDate).join(', ')}</span>` : '';
        return `<td class="${cls(c)}${bal}${lk ? ' lk-cell' : ''}" data-cid="${id}" data-cd="${c.iso}"${tip}>${grip}${hint}${lk}<input class="${k}" data-id="${id}" data-d="${c.iso}" value="${esc(val)}" data-raw="${esc(raw)}" placeholder="${esc(ph)}" inputmode="decimal" autocomplete="off" aria-label="${esc((itemInfo(id) || {}).name)} ${c.iso}" /></td>`;
      };
      const calcCell = (c, v) => `<td class="${cls(c)}"><div class="calc ${v < 0 ? 'neg' : ''}">${money(v)}</div></td>`;
      const span = cols.length;

      // the first "paid from paycheck" section shows the paycheck boxes in its header
      const payHead = data.sections.find(x => x.fromPaycheck);
      const payHeadId = payHead ? payHead.id : null;
      // summary block (paycheck math)
      h += `<tr class="section-head"><td class="col-name"><div class="sec-title"><span class="sec-name" style="font-weight:600;letter-spacing:.04em;font-size:.85rem">Paycheck Summary</span></div></td><td class="col-due"></td><td class="col-budget"></td><td colspan="${span}"></td></tr>`;
      h += `<tr class="sum-row sum-rem"><td class="col-name"><span class="lbl">Remainder<small>Paycheck − paid from paycheck − withdrawals</small></span></td><td class="col-due"></td><td class="col-budget"></td>${cols.map(c => { const r = Math.round(calc[c.iso].remainder * 100) / 100; return `<td class="${cls(c)} ${r < 0 ? 'short' : 'over'}"><div class="calc">${r < 0 ? '−' : '+'}${money(Math.abs(r)) || '$0'}</div></td>`; }).join('')}</tr>`;

      data.sections.forEach(s => {
        h += `<tr class="spacer-row"><td class="col-name"></td><td class="col-due"></td><td class="col-budget"></td><td colspan="${span}"></td></tr>`;
        h += `<tr class="section-head"><td class="col-name"><div class="sec-title"><button type="button" class="sec-toggle${collapsedSecs.has(s.id) ? ' closed' : ''}" data-act="sectoggle" data-sid="${s.id}" title="${collapsedSecs.has(s.id) ? 'Show' : 'Hide'} this section's lines">▲</button><button class="sec-name" data-sec="${s.id}" title="Edit section">${esc(s.name)}</button>${collapsedSecs.has(s.id) ? `<span class="sec-hidden" title="${s.items.length} lines hidden">${s.items.length} hidden</span>` : ''}<button class="add-line" data-add="${s.id}">+ Line</button></div></td><td class="col-due"></td><td class="col-budget">${s.id === payHeadId ? '<span class="tag">PAYCHECK&nbsp;→&nbsp;</span>' : s.fromPaycheck ? '<span class="tag">FROM PAYCHECK&nbsp;</span>' : ''}</td>${s.id === payHeadId ? cols.map(c => inputCell('paycheck', c)).join('') : `<td colspan="${span}"></td>`}</tr>`;
        let budgetTotal = 0;
        const secClosed = collapsedSecs.has(s.id);
        s.items.forEach(it => {
          budgetTotal += it.budget || 0;
          if (secClosed) return;

        if (s.id === payHeadId) {

            const d = Math.round((calc[c.iso].pay - calc[c.iso].sections[s.id]) * 100) / 100;

            const lkIn = inc.length ? `<span class="lk lk-to" data-lk="${inc.map(x => x.from).join(',')}">← ${inc.map(x => fmtDate(x.from)).join(', ')}</span>` : '';

    // ── saving ──
    function setState(s, text) { $('saveState').dataset.s = s; $('saveText').textContent = text; }

    function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({ rev, data })); } catch {} }

    // ── undo / redo: snapshot of the budget before each saved change ──
    let undoStack = [], redoStack = [], lastSnap = null, undoing = false;
    function resetUndo() { undoStack = []; redoStack = []; lastSnap = data ? JSON.stringify(data) : null; updateUndoBtn(); }
    function updateUndoBtn() { const rb = $('redoBtn'); if (rb) { rb.disabled = !redoStack.length; rb.title = redoStack.length ? `Redo (⇧⌘Z) — ${redoStack.length} step${redoStack.length > 1 ? 's' : ''} available` : 'Nothing to redo'; }
      const b = $('undoBtn'); if (!b) return; b.disabled = !undoStack.length; b.title = undoStack.length ? `Undo last change (⌘Z) — ${undoStack.length} step${undoStack.length > 1 ? 's' : ''} available` : 'Nothing to undo'; }
    function recordUndo() {
      if (undoing || !data) return;
      const now = JSON.stringify(data);

      lastSnap = now; updateUndoBtn();

    function restoreSnap(snap) {

      if ($('sheetWrap')) $('sheetWrap').scrollLeft = sl;
      updateUndoBtn();
    }
    function undo() { if (!undoStack.length) return; redoStack.push(lastSnap); restoreSnap(undoStack.pop()); flashUndo('Undone'); }
    function redo() { if (!redoStack.length) return; undoStack.push(lastSnap); restoreSnap(redoStack.pop()); flashBtn('redoBtn', 'Redone', 'Redo'); }
    function flashBtn(id, t, back) { const b = $(id); if (!b) return; const sp = b.querySelector('span'); sp.textContent = t; clearTimeout(flashBtn[id]); flashBtn[id] = setTimeout(() => sp.textContent = back, 900); }
    function flashUndo(t) { const b = $('undoBtn'); if (!b) return; const sp = b.querySelector('span'); sp.textContent = t; clearTimeout(flashUndo.t); flashUndo.t = setTimeout(() => sp.textContent = 'Undo', 900); }

    function scheduleSaveQuiet() { saveLocal(); if (mode !== 'local') { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 700); } }
    function scheduleSave() {
      recordUndo();
      saveLocal();
      if (mode === 'local') { setState('local', 'Saved on this device'); return; }
      setState('saving', 'Saving…');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 700);
    }
    async function saveNow() {
      if (saving) { pendingSave = true; return; }
      saving = true;
      try {
        const res = await fetch(API, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rev, data }) });
        const body = await res.json().catch(() => ({}));
        if (res.ok) { rev = body.rev; saveLocal(); setState('ok', 'Saved'); banner(''); }
        else if (res.status === 409) {
          data = body.data; rev = body.rev; saveLocal(); resetUndo(); render();
          setState('ok', 'Saved');
          banner('This budget was changed on another device, so the latest version was loaded. Please re-enter your last change if it is missing.');
        } else if (res.status === 501) { mode = 'local'; setState('local', 'Saved on this device'); banner(notConfiguredMsg); }
        else { setState('error', 'Not saved'); banner('Could not save to the server (' + esc(body.error || res.status) + '). Your changes are kept on this device; they will save on your next edit.'); }
      } catch {
        setState('error', 'Not saved'); banner('No connection. Your changes are kept on this device and will save on your next edit.');

    }
    const notConfiguredMsg = 'Online storage isn\'t set up yet (BUDGET_KV), so this budget is only saved in this browser on this device.';

    // One-time layout updates applied to saved budgets (runs once per budget).
    function migrate(d) {
      if (!d || !Array.isArray(d.sections)) return false;
      d.migrations = d.migrations || {};
      let changed = false;
      if (!d.migrations.indentGirl) {
        // Diapers, wipes, dance class, stem cell sit under the girl/baby expenses line
        d.sections.forEach(s => s.items.forEach(it => { if (['r63', 'r64', 'r65', 'r66'].includes(it.id)) it.sub = true; }));
        d.migrations.indentGirl = true; changed = true;
      }
      if (!d.migrations.dueFromNames) {
        d.sections.forEach(s => s.items.forEach(it => {
          if (it.due) return;
          const m = String(it.name).match(/\b(\d{1,2})(st|nd|rd|th)\b/i);
          if (!m || +m[1] < 1 || +m[1] > 31) return;
          it.due = String(+m[1]);
          const parts = it.name.split(/\s*-[\s-]*/).map(x => x.trim()).filter(x => x && x.toLowerCase() !== m[0].toLowerCase());
          if (parts.length) it.name = parts.join(' · ');
        }));
        d.migrations.dueFromNames = true; changed = true;
      }
      if (!d.migrations.maryFirst) {
        // Mary's paycheck section goes above Vic's section
        const hi = d.sections.findIndex(x => x.id === 'house'), vi = d.sections.findIndex(x => x.id === 'vic');
        if (hi > vi && vi >= 0) { const [h] = d.sections.splice(hi, 1); d.sections.splice(vi, 0, h); }
        d.migrations.maryFirst = true; changed = true;
      }
      if (d.migrations.splitUnplanned) return changed;
      const i = d.sections.findIndex(s => s.name === 'Projected & Unplanned');
      if (i >= 0) {
        const src = d.sections[i];
        src.name = 'Projected';
        const ids = ['r94', 'r95', 'r98', 'r99', 'r100', 'r101']; // Refrigerator, A/C, medical bills
        const moved = src.items.filter(it => ids.includes(it.id));
        src.items = src.items.filter(it => !ids.includes(it.id));
        d.sections.splice(i + 1, 0, { id: 'unplanned', name: 'Unplanned', fromPaycheck: false, items: moved });
      }
      if (!d.sections.some(s => s.name === 'Emergency Fund')) {
        d.sections.push({ id: 'emergency', name: 'Emergency Fund', fromPaycheck: false, items: [] });
      }
      d.migrations.splitUnplanned = true;
      return true;
    }

    async function load() {
      goToday();
      let local = null;
      try { local = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch {}
      try {
        const res = await fetch(API, { cache: 'no-store' });
        if (res.status === 501 || res.status === 404) throw Object.assign(new Error('nc'), { nc: true });
        if (!res.ok) throw new Error('http ' + res.status);
        const body = await res.json();
        rev = body.rev || 0; data = body.data;
        if (!data && local && local.data) {
          // first time online: offer to move browser-only data to the server
          data = local.data; rev = 0; migrate(data); scheduleSave();
        } else { saveLocal(); setState('ok', 'Saved'); if (migrate(data)) scheduleSave(); }
      } catch (e) {
        mode = 'local';
        data = local && local.data || null; rev = local && local.rev || 0;
        setState('local', 'Saved on this device');
        if (migrate(data)) saveLocal();
        banner(e.nc ? notConfiguredMsg : 'Can\'t reach the server right now — showing the copy saved on this device.');
      }
      if (data && (data.links || data.coveredBy)) { // tidy links left on boxes that are now empty or $0
        let changed = false;
        Object.keys(data.links || {}).forEach(k => {
          const [id, d] = k.split('|'); const v = cellValue(id, d).v;
          if (v == null || v === 0) { delete data.links[k]; changed = true; }
          else if (v < 0) { // old-style link on a short box: it means "covered by" that check
            data.coveredBy = data.coveredBy || {};
            const merged = [...new Set([...lkList(data.coveredBy[k]), ...lkList(data.links[k])])].sort();
            data.coveredBy[k] = merged.length === 1 ? merged[0] : merged; delete data.links[k]; changed = true;
          }
        });
        Object.keys(data.coveredBy || {}).forEach(k => { const [id, d] = k.split('|'); const v = cellValue(id, d).v; if (v == null || v >= 0) { delete data.coveredBy[k]; changed = true; } });
        if (changed) scheduleSaveQuiet();
      }
      resetUndo();
      if (data) {
        goToday();
        // on open: only Mary's Paycheck section and the overview are expanded
        const keep = (data.sections.find(x => x.fromPaycheck) || {}).id;
        collapsedSecs.clear();
        data.sections.forEach(x => { if (x.id !== keep) collapsedSecs.add(x.id); });
        view.statsHidden = true;
        view.ovHidden = false;

      // re-align once web fonts have loaded (column widths change slightly)
      if (data && document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!userScrolled) scrollToNow(); });
    }

    // ── events ──
    document.addEventListener('click', (e) => {
      const t = e.target.closest('[data-act],[data-item],[data-special],[data-sec],[data-add],[data-goto],[data-focus]');
      if (!$('menu').contains(e.target)) $('menu').classList.remove('open');
      if (!t) return;
      if (t.dataset.act === 'prev') { view.extra = 0; shift(-1); render(); }
      else if (t.dataset.act === 'next') { view.extra = 0; shift(1); render(); }
      else if (t.dataset.act === 'today') { goToday(); view.focus = { ...view.start }; jumpToNow = false; render(); $('sheetWrap').scrollLeft = 0; }
      else if (t.dataset.focus) { if (!view.focus) { const [y, m] = t.dataset.focus.split('-').map(Number); view.focus = { y, m }; render(); $('sheetWrap').scrollLeft = 0; } }
      else if (t.dataset.act === 'unfocus') { const f = view.focus; view.focus = null; render(); const th = f && document.querySelector(`#sheetWrap .mon-btn[data-focus="${f.y}-${f.m}"]`); if (th) { const wrap = $('sheetWrap'), bud = wrap.querySelector('thead th.col-budget').getBoundingClientRect(); wrap.scrollLeft += th.closest('th').getBoundingClientRect().left - bud.right; } }
      else if (t.dataset.act === 'secall') { const sl = $('sheetWrap').scrollLeft; const allClosed = data.sections.every(x => collapsedSecs.has(x.id)); if (allClosed) collapsedSecs.clear(); else data.sections.forEach(x => collapsedSecs.add(x.id)); render(); $('sheetWrap').scrollLeft = sl; }
      else if (t.dataset.act === 'sectoggle') { const id = t.dataset.sid, sl = $('sheetWrap').scrollLeft; collapsedSecs.has(id) ? collapsedSecs.delete(id) : collapsedSecs.add(id); render(); $('sheetWrap').scrollLeft = sl; }
      else if (t.dataset.act === 'statstoggle') { const sl = $('sheetWrap') ? $('sheetWrap').scrollLeft : 0; view.statsHidden = !view.statsHidden; render(); $('sheetWrap').scrollLeft = sl; }
      else if (t.dataset.act === 'ovpick' || t.dataset.act === 'ovclear' || t.dataset.act === 'ovall') { const sl = $('sheetWrap') ? $('sheetWrap').scrollLeft : 0; const ox = document.querySelector('.ov-scroll') ? document.querySelector('.ov-scroll').scrollLeft : 0; if (t.dataset.act === 'ovclear') ovPicked.clear(); else if (t.dataset.act === 'ovall') t.dataset.keys.split(',').forEach(k => ovPicked.add(k)); else { const k = t.dataset.k; ovPicked.has(k) ? ovPicked.delete(k) : ovPicked.add(k); } render(); $('sheetWrap').scrollLeft = sl; if (document.querySelector('.ov-scroll')) document.querySelector('.ov-scroll').scrollLeft = ox; }
      else if (t.dataset.act === 'ovtoggle') { const sl = $('sheetWrap') ? $('sheetWrap').scrollLeft : 0; view.ovHidden = !view.ovHidden; saveView(); render(); $('sheetWrap').scrollLeft = sl; }
      else if (t.dataset.goto) { const [y, m] = t.dataset.goto.split('-').map(Number); view.start = { y, m }; render(); $('sheetWrap').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      else if (t.dataset.act === 'import') $('fileInput').click();
      else if (t.dataset.act === 'blank') { data = blankData(); scheduleSave(); render(); }
      else if (t.dataset.item) openItem(t.dataset.item);
      else if (t.dataset.special) openSpecial(t.dataset.special);
      else if (t.dataset.sec) openSection(t.dataset.sec);

    });
    document.addEventListener('change', (e) => {
      const t = e.target;

        view.months = +t.value; view.extra = 0; saveView();
        render(); return;
      }
