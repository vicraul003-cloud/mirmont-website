    });
    document.addEventListener('keydown', (e) => {
      const t = e.target;
      if (!t.matches || !t.matches('.cell input')) return;
      if (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const td = t.closest('td'), tr = td.parentElement, idx = [...tr.children].indexOf(td);
        let row = tr;
        do { row = e.key === 'ArrowUp' ? row.previousElementSibling : row.nextElementSibling; }
        while (row && !(row.children[idx] && row.children[idx].querySelector('input')));
        const target = row && row.children[idx].querySelector('input');
        const key = target && [target.dataset.id, target.dataset.d];
        commitCell(t, () => {
          if (key) { const n = document.querySelector(`.cell input[data-id="${key[0]}"][data-d="${key[1]}"]`); if (n) { n.focus(); n.select(); } }
          else if (document.activeElement) document.activeElement.blur();
        });
      } else if (e.key === 'Escape') { t.value = t.defaultValue; t.blur(); }
    });

    let applyPending = null; // {resolve} while the apply-to prompt is open

    // later pay dates (up to ~3 years) for scanning the future
    function futurePeriods(iso) {
      const t = fromISO(iso) + DAY;
      return periodsBetween(t, t + 3 * 366 * DAY);
    }
    // links: "this box (item|date) sets money aside for that later paycheck" — chosen from the right-click menu
    function linksTo(iso) {
      const out = [];
      Object.entries(data.links || {}).forEach(([k, to]) => {
        if (!lkList(to).includes(iso)) return;
        const [id, from] = k.split('|'); const cv = cellValue(id, from);
        if (cv.v == null || cv.v === 0) return;
        out.push({ id, from, v: cv.v || 0, name: (itemInfo(id) || {}).name || '' });
      });
      return out.sort((a, b) => a.from.localeCompare(b.from));
    }
    // box emptied / set to $0: forget its "covers" link (and, on Adjustments, links pointing at it) so a new date can be picked
    function dropLinks(id, iso) {
      if (data.links) delete data.links[id + '|' + iso];
      if (data.coveredBy) delete data.coveredBy[id + '|' + iso];
    }
    const lkList = (v) => Array.isArray(v) ? v : (v ? [v] : []);
    function setLink(keys, to) { // to: array of pay dates, or null to remove
      data.links = data.links || {};
      keys.forEach(k => {
        if (k[0] === '=' || k.startsWith('paycheck|')) return;
        const [id, d0] = k.split('|'); const t = (to || []).filter(d => d !== d0).sort();
        const neg = (cellValue(id, d0).v || 0) < 0; // a negative (short) box is COVERED BY the picked check
        const map = neg ? (data.coveredBy = data.coveredBy || {}) : data.links;
        delete (neg ? data.links : (data.coveredBy || {}))[k];
        if (t.length) map[k] = t.length === 1 ? t[0] : t; else delete map[k];
      });
      redraw();
    }
    const fmtDate = (iso) => { const d = new Date(fromISO(iso)); return `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`; };

    function redraw() {
      const sl = $('sheetWrap') ? $('sheetWrap').scrollLeft : 0;
      render();
      if ($('sheetWrap')) $('sheetWrap').scrollLeft = sl;
      scheduleSave();
    }

    function commitCell(input, after) {
      const done = () => { if (after) after(); };
      if (applyPending) return; // prompt already open for this edit
      const id = input.dataset.id, iso = input.dataset.d;
      if (!data.values) data.values = {};
      const cur = (data.values[id] || {})[iso];
      const n = parseAmt(input.value);
      if (Number.isNaN(n)) { input.value = input.defaultValue; input.animate([{ background: '#fde2e2' }, { background: 'transparent' }], 700); done(); return; }
      if ((n === null && cur === undefined) || n === cur) { done(); return; }

      const before = cellValue(id, iso).v;
      const it = itemInfo(id) || {};
      const repeats = it.repeat && it.repeat !== 'off';
      const future = futurePeriods(iso);
      const vals = data.values[id] || {};
      const sameLater = Object.keys(vals).filter(d => d > iso); // every later box that has its own amount

      // Clearing a box, or a one-off line with nothing later to update: just save it.
      if (n === null || (!repeats && sameLater.length === 0) || before === n) {
        setValue(id, iso, n); redraw(); done(); askCover(id, iso, n); return;
      }

      const name = it.name || 'this line';
      $('applyText').innerHTML = before != null
        ? `<b>${esc(name)}</b>: ${money(before)} → <b>${money(n)}</b> on ${fmtDate(iso)}.`
        : `<b>${esc(name)}</b>: <b>${money(n)}</b> on ${fmtDate(iso)}.`;
      $('applyOne').innerHTML = `Just ${fmtDate(iso)}<small>Later pay periods keep ${before != null ? 'their current amount' : 'what they have now'}</small>`;
      $('applyFuture').innerHTML = `${fmtDate(iso)} and all future<small>Every later pay period for this line becomes ${money(n)}</small>`;

      applyPending = { id, iso, n, before, future, sameLater, input, done };
      $('applyOne').classList.add('primary'); $('applyFuture').classList.remove('primary');
      $('applyDlg').showModal();
      $('applyOne').focus(); // Enter = just this pay period
    }

    // Amount per occurrence implied by a monthly budget
    function perOccurrence(budget, repeat) {
      const mult = { every: 0.5, monthly: 1, quarterly: 3, semiannual: 6, yearly: 12 }[repeat] || 1;
      return Math.round(budget * mult * 100) / 100;
    }
    const occLabel = { every: 'each paycheck', monthly: 'each month', quarterly: 'every 3 months', semiannual: 'every 6 months', yearly: 'once a year' };

    function askBudgetApply(it, oldBudget) {
      const amt = perOccurrence(it.budget, it.repeat);
      const nowP = currentPeriod();
      $('applyText').innerHTML = `<b>${esc(it.name)}</b> budget: ${oldBudget != null ? money(oldBudget) + ' → ' : ''}<b>${money(it.budget)}</b>/mo.<br>Update the amounts in the pay-period boxes too?`;
      $('applyOne').innerHTML = `Only change the budget number<small>The boxes keep their amounts</small>`;
      $('applyFuture').innerHTML = `Update boxes from ${fmtDate(nowP)} onward<small>${money(amt)} ${occLabel[it.repeat] || ''}${it.repeat === 'every' ? ' (half the monthly budget)' : ''}; earlier boxes stay as they are</small>`;
      applyPending = { kind: 'budget', id: it.id, amt };
      $('applyFuture').classList.add('primary'); $('applyOne').classList.remove('primary');
      $('applyDlg').showModal();
      $('applyFuture').focus();
    }

    // Set this line's amount from the current pay period onward
    function applyBudget(id, amt) {
      const nowP = currentPeriod();
      const periods = [nowP, ...futurePeriods(nowP)];
      const anchor = periods.find(d => { const v = cellValue(id, d).v; return v != null && v !== 0; }) || nowP;
      const vals = data.values[id] || {};
      Object.keys(vals).forEach(d => { if (d > anchor) setValue(id, d, amt); });
      setValue(id, anchor, amt);
    }

    // Set one pay period without changing what later periods show
    function setOnlyThis(id, iso, n) {
      if (id[0] === '=') return; // calculated box: read only
      const snap = futurePeriods(iso).map(d => [d, cellValue(id, d)]);
      setValue(id, iso, n);
      for (const [d, old] of snap) {
        const now = cellValue(id, d);
        if (!now.carried) { if ((data.values[id] || {})[d] !== undefined) break; else continue; }
        if (now.v !== old.v) { setValue(id, d, old.v == null ? 0 : old.v, true); break; }
      }
    }

    // Suggested amount: monthly budget split across the paychecks in that month
    // ── bill planning: which paychecks pay each bill, based on the Due column ──
    const MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
    const everyMonths = { quarterly: 3, semiannual: 6, yearly: 12 };
    const mIdx = (iso) => (+iso.slice(0, 4)) * 12 + (+iso.slice(5, 7) - 1);
    const dueOn = (mi, day) => { const y = Math.floor(mi / 12), m = mi % 12, dim = new Date(Date.UTC(y, m + 1, 0)).getUTCDate(); return toISO(Date.UTC(y, m, Math.min(day, dim))); };
    function dueRule(it) {
      const t = String(it.due || '').trim();
      let m;
      if (/^\d{1,2}$/.test(t) && +t >= 1 && +t <= 31) {
        const F = everyMonths[it.repeat] || 1;
        let anchor = 0;
        if (F > 1) { const ds = explicitDates(it.id).filter(d => data.values[it.id][d]); anchor = ds.length ? mIdx(ds[0]) : mIdx(toISO(todayUTC())); }
        return { day: +t, F, anchor };
      }
      if (/^(eom|end of month|last day)/i.test(t)) return { day: 31, F: everyMonths[it.repeat] || 1, anchor: 0 };
      if ((m = t.match(/^([a-z]{3})[a-z]*\.?\s+(\d{1,2})/i)) && MON[m[1].toLowerCase()] != null) {
        return { day: +m[2], F: everyMonths[it.repeat] && everyMonths[it.repeat] < 12 ? everyMonths[it.repeat] : 12, anchor: MON[m[1].toLowerCase()] };
      }
      if (everyMonths[it.repeat]) { // e.g. "Quarterly" with no day: due at the end of the cycle month
        const F = everyMonths[it.repeat], ds = explicitDates(it.id).filter(d => data.values[it.id][d]);
        return { day: 31, F, anchor: ds.length ? mIdx(ds[0]) : mIdx(toISO(todayUTC())) };
      }
      return null; // no usable due date: plan by calendar month
    }
    // Which bill this pay period helps pay: the next due date on/after it.
    // A bill is paid by the checks that arrive after the previous due date and on/before its own due date.
    function billWindow(id, iso) {
      const it = itemInfo(id);
      if (!it || !it.budget || data.special[id] || it.noHelp) return null;
      const ign = (due) => !!(data.ignoreDue && data.ignoreDue[id + '|' + due]);
      const r = dueRule(it);
      if (r) {
        const ok = (mi) => (((mi - r.anchor) % r.F) + r.F) % r.F === 0;
        let mi = mIdx(iso);
        for (let k = 0; k < 30; k++, mi++) { if (ok(mi) && dueOn(mi, r.day) >= iso) break; }
        const due = dueOn(mi, r.day), prev = dueOn(mi - r.F, r.day);
        const checks = periodsBetween(fromISO(prev) + DAY, fromISO(due) + DAY);
        if (!checks.length || ign(due)) return null;
        const payer = checks[checks.length - 1];                // last check before the bill is due
        const cross = payer.slice(0, 7) !== due.slice(0, 7);   // paid in the month before it's due
        const A = Math.round(it.budget * r.F * 100) / 100;
        return { it, A, checks, eligible: [payer], payer, cross, due, label: `due ${fmtDate(due)}` };
      }
      // no day in the Due column: one bill per calendar month, spread over that month's checks
      const checks = periodsInMonth(iso);
      if (!checks.length) return null;
      const d = new Date(fromISO(iso));
      const due = toISO(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0));
      if (ign(due)) return null;
      return { it, A: it.budget, checks, eligible: checks, payer: null, cross: false, due, label: `for ${MONTHS[d.getUTCMonth()]}` };
    }
    function suggestion(id, iso) {
      const w = billWindow(id, iso); if (!w) return null;
      const have = Math.round(w.checks.reduce((t, c) => t + (cellValue(id, c).v || 0), 0) * 100) / 100;
      const short = Math.round((w.A - have) * 100) / 100;
      const idx = w.eligible.indexOf(iso), n = w.eligible.length;
      let amt = null;
      if (idx >= 0) {
        const share = short > 0 ? Math.floor(short / n * 100) / 100 : 0;
        const add = idx === n - 1 ? Math.round((short - share * (n - 1)) * 100) / 100 : share;
        amt = Math.round(((cellValue(id, iso).v || 0) + Math.max(add, 0)) * 100) / 100;
      }
      return { amt, eligible: idx >= 0, n, A: w.A, label: w.label, due: w.due, cross: w.cross, payer: w.payer, checks: w.checks, have, short, budget: w.it.budget };
    }

    function finishApply(choice) {
      const p = applyPending; if (!p) return;
      applyPending = null;
      $('applyDlg').close();
      if (p.kind === 'budget') { if (choice === 'future') applyBudget(p.id, p.amt); render(); scheduleSave(); return; }
      if (choice === 'cancel') { p.input.value = p.input.defaultValue; p.input.focus(); return; }
      const { id, iso, n, before, future, sameLater } = p;
      if (choice === 'one') {
        setOnlyThis(id, iso, n);
      } else {
        setValue(id, iso, n);
        sameLater.forEach(d => setValue(id, d, n));
      }
      redraw();
      p.done();
      if (choice === 'one') askCover(id, iso, n);
    }
    $('applyOne').addEventListener('click', () => finishApply('one'));
    $('applyFuture').addEventListener('click', () => finishApply('future'));
    $('applyCancel').addEventListener('click', () => finishApply('cancel'));
    $('applyDlg').addEventListener('cancel', (e) => { e.preventDefault(); finishApply('cancel'); });

    // ── multi-select like Excel: ⌘/Ctrl+click adds boxes, Shift+click selects a block; sum shows top-right ──
    const sel = new Set(); let selAnchor = null;
    const keyOf = (td) => td.dataset.cid + '|' + td.dataset.cd;
    function paintSelection() {
      document.querySelectorAll('#sheetWrap td.cell.sel').forEach(td => td.classList.remove('sel'));
      sel.forEach(k => { const [id, d] = k.split('|'); const td = document.querySelector(`#sheetWrap td.cell[data-cid="${id}"][data-cd="${d}"]`); if (td) td.classList.add('sel'); });
      const box = $('selSum');
      if (sel.size < 2) { box.classList.remove('show'); return; }
      let sum = 0, n = 0;
      sel.forEach(k => { const [id, d] = k.split('|'); const v = cellValue(id, d).v; if (v != null) { sum += v; n++; } });
      sum = Math.round(sum * 100) / 100;
      box.innerHTML = `<span class="lbl">Sum</span><b class="${sum < 0 ? 'neg' : ''}">${sum < 0 ? '−' : ''}${money(Math.abs(sum)) || '$0'}</b><span class="meta">${sel.size} cells${n ? ' · Avg ' + money(Math.round(sum / n * 100) / 100) : ''}</span>`;
      box.classList.add('show');
    }
    function clearSelection() { if (sel.size) { sel.clear(); paintSelection(); } }
    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0 || (e.ctrlKey && !e.metaKey && /Mac/.test(navigator.platform))) return; // right-click (or Mac ctrl-click) opens the menu instead
      const td = e.target.closest && e.target.closest('#sheetWrap td.cell[data-cid]');
      const multi = e.metaKey || e.ctrlKey;
      if (!td) { if (!(e.target.closest && e.target.closest('#selSum'))) clearSelection(); return; }
      if (e.target.closest('.grip, .sugg, .sugg-pop')) return;
      if (multi) {
        e.preventDefault();
        if (!sel.size && selAnchor && selAnchor !== keyOf(td)) sel.add(selAnchor); // include the box you were in
        const k = keyOf(td); sel.has(k) ? sel.delete(k) : sel.add(k);
        selAnchor = k; paintSelection();
      } else if (e.shiftKey && selAnchor) {
        e.preventDefault();
        const [aid, ad] = selAnchor.split('|');
        const a = document.querySelector(`#sheetWrap td.cell[data-cid="${aid}"][data-cd="${ad}"]`); if (!a) return;
        const rows = [...document.querySelectorAll('#sheetWrap tbody tr')];
        const r1 = rows.indexOf(a.parentElement), r2 = rows.indexOf(td.parentElement);
        const c1 = a.cellIndex, c2 = td.cellIndex;
        sel.clear();
        for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) {
          [...rows[r].children].forEach(cell => { if (cell.matches('td.cell[data-cid]') && cell.cellIndex >= Math.min(c1, c2) && cell.cellIndex <= Math.max(c1, c2)) sel.add(keyOf(cell)); });
        }
        paintSelection();
      } else {
        clearSelection(); selAnchor = keyOf(td);
      }
    });
    document.addEventListener('focusin', (e) => { const td = e.target.closest && e.target.closest('#sheetWrap td.cell[data-cid]'); if (td && !sel.size) selAnchor = keyOf(td); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') clearSelection(); });

    // ── Adjustments line: after typing an amount, ask which paycheck it pairs with ──
    function closeCover() { const x = $('coverPop'); if (x) x.remove(); }
    function askCover(id, iso, n) {
      const it = itemInfo(id);
      if (!it || !/adjust/i.test(it.name || '') || n == null || n === 0) return;
      closeCover();
      const step = (data.periodDays || 14) * DAY, give = n > 0, dates = [];
      if (give) for (let i = 1; i <= 12; i++) dates.push(toISO(fromISO(iso) + i * step));
      else for (let i = 8; i >= 1; i--) dates.push(toISO(fromISO(iso) - i * step));
      const cur = give ? lkList(data.links && data.links[id + '|' + iso])
        : lkList(data.coveredBy && data.coveredBy[id + '|' + iso]);
      const yr = iso.slice(0, 4);
      const pop = document.createElement('div'); pop.id = 'coverPop'; pop.className = 'cover-pop';
      pop.innerHTML = `<div class="cp-title">${give ? `<b>${money(n)}</b> set aside on ${fmtDate(iso)} — which paycheck is it for?` : `<b>${money(Math.abs(n))}</b> short on ${fmtDate(iso)} — which paycheck is covering it?`}</div>
        <div class="cp-dates">${dates.map(d => `<button type="button" data-cp="${d}" class="${cur.includes(d) ? 'on' : ''}">${fmtDate(d)}${d.slice(0, 4) !== yr ? " '" + d.slice(2, 4) : ''}</button>`).join('')}</div>
        <div class="cp-acts">${give ? '<button type="button" data-cpa="sheet">Pick on the sheet…</button>' : ''}<button type="button" data-cpa="skip">Skip</button></div>`;
      document.body.appendChild(pop);
      const td = document.querySelector(`#sheetWrap td.cell[data-cid="${id}"][data-cd="${iso}"]`);
      const r = td ? td.getBoundingClientRect() : { left: innerWidth / 2 - 150, bottom: 120, top: 120 }, pr = pop.getBoundingClientRect();
      pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pr.width - 8)) + 'px';
      pop.style.top = (r.bottom + pr.height + 8 < innerHeight ? r.bottom + 4 : Math.max(8, r.top - pr.height - 4)) + 'px';
      pop.dataset.t = Date.now();
      pop.addEventListener('mousedown', (e) => e.stopPropagation());
      pop.addEventListener('click', (e) => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.cpa === 'skip') { closeCover(); return; }
        if (b.dataset.cpa === 'sheet') { closeCover(); startLinkPick([id + '|' + iso]); return; }
        const d = b.dataset.cp; closeCover();
        data.links = data.links || {};
        if (give) setLink([id + '|' + iso], [d]);
        else { data.coveredBy = data.coveredBy || {}; data.coveredBy[id + '|' + iso] = d; redraw(); }
      });
    }
    document.addEventListener('mousedown', (e) => { const x = $('coverPop'); if (x && !(e.target.closest && e.target.closest('#coverPop')) && Date.now() - (+x.dataset.t || 0) > 200) closeCover(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCover(); });

    // ── "Covers paycheck…": pick mode — click the box(es) of the paycheck(s) this money is for ──
    let linkPick = null; // { keys, picked: Set of dates }
    function startLinkPick(keys) {
      if (!keys.length) return;
      const k0 = keys[0], neg0 = keys.length === 1 && (cellValue(k0.split('|')[0], k0.split('|')[1]).v || 0) < 0;
      linkPick = { keys, picked: new Set(keys.length === 1 ? lkList(neg0 ? data.coveredBy && data.coveredBy[k0] : data.links && data.links[k0]) : []) };
      let bar = $('linkBar');
      if (!bar) { bar = document.createElement('div'); bar.id = 'linkBar'; bar.className = 'link-bar'; document.body.appendChild(bar); }
      document.documentElement.classList.add('link-picking');
      paintLinkPick();
    }
    function endLinkPick(save) {
      if (!linkPick) return;
      const lp = linkPick; linkPick = null;
      document.documentElement.classList.remove('link-picking');
      const bar = $('linkBar'); if (bar) bar.remove();
      document.querySelectorAll('#sheetWrap .lk-col, #sheetWrap .lk-src').forEach(x => x.classList.remove('lk-col', 'lk-src'));
      if (save) setLink(lp.keys, [...lp.picked]);
    }
    function paintLinkPick() {
      if (!linkPick) return;
      document.querySelectorAll('#sheetWrap .lk-col, #sheetWrap .lk-src').forEach(x => x.classList.remove('lk-col', 'lk-src'));
      linkPick.keys.forEach(k => { const [id, d] = k.split('|'); const x = document.querySelector(`#sheetWrap td.cell[data-cid="${id}"][data-cd="${d}"]`); if (x) x.classList.add('lk-src'); });
      linkPick.picked.forEach(d => document.querySelectorAll(`#sheetWrap td.cell[data-cd="${d}"], #sheetWrap th.c${d}`).forEach(x => x.classList.add('lk-col')));
      const from = linkPick.keys.map(k => k.split('|')[1]).sort()[0];
      const pk = [...linkPick.picked].sort();
      const negP = linkPick.keys.length === 1 && (cellValue(linkPick.keys[0].split('|')[0], from).v || 0) < 0;
      $('linkBar').innerHTML = `<span>${negP ? `<b>Covered by paycheck:</b> click the box of the paycheck covering this ${fmtDate(from)} shortage` : `<b>Covers paycheck:</b> click the box of the paycheck this ${fmtDate(from)} money is for`} (1 or 2 — click again to unpick)</span>
        <span class="lb-picked">${pk.length ? (negP ? '← ' : '→ ') + pk.map(fmtDate).join(', ') : 'none picked yet'}</span>
        <button type="button" class="lb-done" data-lb="done">Done</button>
        <button type="button" class="lb-cancel" data-lb="cancel">Cancel</button>`;
    }
    document.addEventListener('mousedown', (e) => {
      if (!linkPick) return;
      const lb = e.target.closest && e.target.closest('#linkBar');
      if (lb) { const b = e.target.closest('button[data-lb]'); if (b && !b.disabled) { e.preventDefault(); endLinkPick(b.dataset.lb === 'done'); } return; }
      const td = e.target.closest && e.target.closest('#sheetWrap td.cell[data-cd], #sheetWrap tr.dates th');
      if (!td) return; // scrolling, menus etc. still work while picking
      e.preventDefault(); e.stopPropagation();
      const d = td.dataset.cd || ([...td.classList].find(c => /^c\d{4}-/.test(c)) || '').slice(1);
      if (!d || linkPick.keys.some(k => k.endsWith('|' + d))) return;
      linkPick.picked.has(d) ? linkPick.picked.delete(d) : linkPick.picked.add(d);
      paintLinkPick();
    }, true);
    document.addEventListener('click', (e) => { if (linkPick && e.target.closest && e.target.closest('#sheetWrap table')) { e.preventDefault(); e.stopPropagation(); } }, true);
    { const _render = render; render = function () { const r = _render.apply(this, arguments); setHeadH(); if (linkPick) paintLinkPick(); return r; }; }
    function setHeadH() { const w = $('sheetWrap'), th = w && w.querySelector('thead'); if (th) w.style.setProperty('--hd-h', th.getBoundingClientRect().height + 'px'); }
    setHeadH(); window.addEventListener('resize', setHeadH); if (document.fonts && document.fonts.ready) document.fonts.ready.then(setHeadH);
    document.addEventListener('keydown', (e) => {
      if (!linkPick) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); endLinkPick(false); }
      else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); endLinkPick(true); }
    }, true);

    // hover a link tag to outline the paycheck(s) on the other end
    document.addEventListener('mouseover', (e) => {
      const t = e.target.closest && e.target.closest('.lk');
      document.querySelectorAll('#sheetWrap td.lk-partner').forEach(x => x.classList.remove('lk-partner'));
      if (!t) return;
      const td = t.closest('td.cell');
      if (t.classList.contains('lk-from')) t.dataset.lk.split(',').forEach(d => { const x = document.querySelector(`#sheetWrap tr.diff-row td[data-cd="${d}"]`); if (x) x.classList.add('lk-partner'); });
      else t.dataset.lk.split(',').forEach(d => Object.entries(data.links || {}).forEach(([k, to]) => { if (lkList(to).includes(td.dataset.cd) && k.endsWith('|' + d)) { const [id] = k.split('|'); const x = document.querySelector(`#sheetWrap td.cell[data-cid="${id}"][data-cd="${d}"]`); if (x) x.classList.add('lk-partner'); } }));
      if (t.classList.contains('lk-to') && td && !td.closest('tr.diff-row')) t.dataset.lk.split(',').forEach(d => { const x = document.querySelector(`#sheetWrap tr.diff-row td[data-cd="${d}"]`); if (x) x.classList.add('lk-partner'); });
      if (td) td.classList.add('lk-partner');
    });

    // ── right-click menu: copy / paste / delete (set to $0) ──
    let clip = null; // { v, from }
    function closeCtx() { const m = document.getElementById('ctxMenu'); if (m) m.remove(); }
    function cellKeysSorted(keys) { return [...keys].sort((a, b) => a.split('|')[1].localeCompare(b.split('|')[1])); }
    document.addEventListener('contextmenu', (e) => {
      const td = e.target.closest && e.target.closest('#sheetWrap td.cell[data-cid]');
      closeCtx();
      if (!td) return;
      e.preventDefault();
      const k = keyOf(td);
      if (!sel.has(k)) { sel.clear(); sel.add(k); selAnchor = k; }
      paintSelection();
      const targets = cellKeysSorted(sel);
      const [cid, cd] = k.split('|');
      const cur = cellValue(cid, cd).v;
      const canEdit = targets.some(t => t[0] !== '=');
      const n = targets.filter(t => t[0] !== '=').length, many = n > 1 ? ` (${n} cells)` : '';
      const m = document.createElement('div'); m.id = 'ctxMenu'; m.className = 'ctx-menu'; m.dataset.t = Date.now();
      m.innerHTML = `
        <button type="button" data-ctx="copy" ${cur == null ? 'disabled' : ''}>Copy <span>${cur == null ? 'empty' : money(cur) || '$0'}</span></button>
        <button type="button" data-ctx="paste" ${canEdit ? '' : 'disabled title="Read-only box"'}>Paste${many} <span>${clip ? money(clip.v) || '$0' : 'from clipboard'}</span></button>
        ${(() => {
          const ed = targets.filter(t => t[0] !== '=' && !t.startsWith('paycheck|'));
          if (!ed.length) return '';
          const neg1 = ed.length === 1 && (cellValue(ed[0].split('|')[0], ed[0].split('|')[1]).v || 0) < 0;
          const curLink = ed.length === 1 ? lkList(neg1 ? data.coveredBy && data.coveredBy[ed[0]] : data.links && data.links[ed[0]]) : [];
          return `<div class="sep"></div>
            <button type="button" data-ctx="covers">${neg1 ? 'Covered by paycheck…' : 'Covers paycheck…'} <span>${curLink.length ? (neg1 ? '← ' : '→ ') + curLink.map(fmtDate).join(', ') : 'click boxes to pick'}</span></button>
            ${ed.some(t => (data.links && data.links[t]) || (data.coveredBy && data.coveredBy[t])) ? '<button type="button" data-ctx="unlink">Remove link</button>' : ''}`;
        })()}
        <div class="sep"></div>
        <button type="button" data-ctx="zero" class="danger" ${canEdit ? '' : 'disabled title="Read-only box"'}>Delete — set to $0${many}</button>`;
      document.body.appendChild(m);
      const r = m.getBoundingClientRect();
      m.style.left = Math.min(e.clientX, window.innerWidth - r.width - 8) + 'px';
      m.style.top = Math.min(e.clientY, window.innerHeight - r.height - 8) + 'px';
      m.addEventListener('click', async (ev) => {
        const b = ev.target.closest('button[data-ctx]'); if (!b || b.disabled) return;
        const act = b.dataset.ctx;
        if (act === 'covers') { const ed = targets.filter(t => t[0] !== '=' && !t.startsWith('paycheck|')); closeCtx(); clearSelection(); startLinkPick(ed); return; }
        if (act === 'unlink') { setLink(targets, null); closeCtx(); clearSelection(); return; }
        if (act === 'paste' && !clip) {
          let txt = '';

    }
    $('fUp').addEventListener('click', () => moveItem(-1));
    $('fDown').addEventListener('click', () => moveItem(1));

    // ── section dialog ──
    let editingSec = null;
    function openSection(id) {
      editingSec = id;
      const s = id ? data.sections.find(x => x.id === id) : { name: '', fromPaycheck: false };
      $('secDlgTitle').textContent = id ? 'Edit section' : 'New section';
      $('sName').value = s.name; $('sFromPay').checked = !!s.fromPaycheck;
      ['sUp', 'sDown', 'sDelete'].forEach(k => $(k).style.display = id ? '' : 'none');
      $('secDlg').showModal(); $('sName').focus();
    }
    $('secForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = $('sName').value.trim(); if (!name) return;
      if (editingSec) Object.assign(data.sections.find(x => x.id === editingSec), { name, fromPaycheck: $('sFromPay').checked });
      else data.sections.push({ id: uid(), name, fromPaycheck: $('sFromPay').checked, items: [] });
      $('secDlg').close(); render(); scheduleSave();
    });
    $('sCancel').addEventListener('click', () => $('secDlg').close());
    $('sDelete').addEventListener('click', () => {
      const i = data.sections.findIndex(x => x.id === editingSec), s = data.sections[i];
      if (s.items.length && !confirm(`Delete section "${s.name}" and its ${s.items.length} lines?`)) return;
      s.items.forEach(it => delete data.values[it.id]);
      data.sections.splice(i, 1); $('secDlg').close(); render(); scheduleSave();
    });
    function moveSec(dir) {
      const i = data.sections.findIndex(x => x.id === editingSec), j = i + dir;
      if (j < 0 || j >= data.sections.length) return;
      [data.sections[i], data.sections[j]] = [data.sections[j], data.sections[i]]; render(); scheduleSave();
    }
    $('sUp').addEventListener('click', () => moveSec(-1));
    $('sDown').addEventListener('click', () => moveSec(1));

    // test hook
    window.__budget = { computePeriod: (iso) => computePeriod(iso), get data() { return data; }, cellValue: (id, iso) => cellValue(id, iso) };

    load();
  })();
  </script>
</body>
</html>
